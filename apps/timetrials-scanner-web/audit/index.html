<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <title>MK8DX TT Scanner — audit</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0d12" />
  <link rel="stylesheet" href="./audit.css" />
</head>
<body>
  <h1>Scanner-audit</h1>
  <div class="sub">Doorloopt alle stappen van de scanner op dit toestel en laat zien wat slaagt en waar het blijft hangen. Duur: 1–3 minuten. Daarna: "Rapport kopiëren" en de tekst doorsturen.</div>
  <div class="bar">
    <button id="start" class="primary">▶ Audit starten</button>
    <button id="copy" disabled>📋 Rapport kopiëren</button>
    <button id="share" disabled>↗ Delen</button>
    <button id="reset">⟲ Cache wissen</button>
  </div>
  <div id="steps"></div>
  <div id="summary"></div>
  <textarea id="report" readonly placeholder="Rapporttekst verschijnt hier na de audit (voor kopiëren als de knop niet werkt)."></textarea>
  <script type="module" src="/src/audit.ts"></script>
</body>
</html>
