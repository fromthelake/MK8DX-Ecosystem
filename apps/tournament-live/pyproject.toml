[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mk8dx-tournament-live"
version = "0.4.0"
description = "Live-capture MK8DX tournament processing product"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mk8dx-tournament-extraction[vision]==0.1.0",
  "mk8dx-tournament-connected==0.2.0",
]

[project.scripts]
mk8dx-tournament-live-results = "tournament_live.cli:main"
mk8dx-tournament-live = "live_processor.run_gui:main"
mk8dx-tournament-live-cli = "live_processor.cli:main"

[project.optional-dependencies]
gui = ["PySide6>=6.6,<6.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
live_processor = ["broadcast_web/*.html", "broadcast_web/*.css", "broadcast_web/*.js", "schema9-track-presentation.json", "i18n/*.json"]
