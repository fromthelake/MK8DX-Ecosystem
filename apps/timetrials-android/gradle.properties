org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
# AGP 9 transition: keep the explicit Kotlin Android plugin until the Kotlin stream is migrated.
android.builtInKotlin=false
android.newDsl=false
# Generated recognition/product assets are staged by explicit build-script task dependencies.
# Keep Provider-backed source directories until these tasks use the AGP Variant Sources API.
android.sourceset.disallowProvider=false
kotlin.code.style=official
