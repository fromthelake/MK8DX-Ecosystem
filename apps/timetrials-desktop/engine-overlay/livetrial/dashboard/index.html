<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LiveTrial — MK8DX Time Trials</title>
<link rel="icon" href="/app-icon">
<script>/* apply saved theme before first paint (no flash) */
// The desktop app shows the live block and the run history in separate tabs (owner 2026-09-27).
(() => { const p = new URLSearchParams(location.search), v = p.get("view");
  if (v === "live" || v === "history") document.documentElement.dataset.view = v;
  if (p.get("embedded") === "1") document.documentElement.dataset.embedded = "1"; })();
(() => { const q = new URLSearchParams(location.search).get("theme"); const t = q === "dark" || q === "light" ? q : localStorage.getItem("lt-theme"); if (t) document.documentElement.dataset.theme = t; })();
</script>
<style>
  :root {
    color-scheme: light;
    --surface-1: #fffdf6; --page: #f5f2e8;
    --ink-1: #1c1a14; --ink-2: #565348; --ink-muted: #8d8a7c;
    --grid: #e6e2d3; --baseline: #c9c5b3; --border: rgba(28,26,20,0.11);
    --player: #2a78d6; --ghost: #e8622a;
    --good-text: #0f8c31; --bad-text: #d03b3b; --gold: #dfa000;
    --tile: #ffffff; --tile-2: #faf8ef;
    --chip-ink: #ffffff;
    /* cc colors sampled from 004_menu_hint_cc_toggle.png. */
    --cc150: #4672ca; --cc200: #c8595f;
    --state-menu: #4d9de0; --state-armed: #f0a41c; --state-racing: #23a04b; --state-reading: #8f56f0;
    --rainbow: linear-gradient(90deg,#e6194b,#f58231,#ffd028,#3cb44b,#4363d8,#911eb4);
    --shadow-1: 0 1px 3px rgba(28,26,20,.08);
    --shadow-2: 0 4px 14px rgba(28,26,20,.13);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1: #191c30; --page: #0f1122;
    --ink-1: #f2f3fa; --ink-2: #b8bcd4; --ink-muted: #7e829e;
    --grid: #272b45; --baseline: #363b5c; --border: rgba(242,243,250,0.11);
    --player: #4a95ef; --ghost: #ff7a3d;
    --good-text: #35cf62; --bad-text: #ff7070; --gold: #ffc233;
    --tile: #202440; --tile-2: #1b1e37;
    --chip-ink: #ffffff;
    --shadow-1: 0 1px 3px rgba(0,0,0,.3);
    --shadow-2: 0 5px 18px rgba(0,0,0,.45);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface-1: #191c30; --page: #0f1122;
      --ink-1: #f2f3fa; --ink-2: #b8bcd4; --ink-muted: #7e829e;
      --grid: #272b45; --baseline: #363b5c; --border: rgba(242,243,250,0.11);
      --player: #4a95ef; --ghost: #ff7a3d;
      --good-text: #35cf62; --bad-text: #ff7070; --gold: #ffc233;
      --tile: #202440; --tile-2: #1b1e37;
      --shadow-1: 0 1px 3px rgba(0,0,0,.3);
      --shadow-2: 0 5px 18px rgba(0,0,0,.45);
    }
  }
  :root.notrans *, :root.notrans { transition: none !important; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink-1);
         font: 14px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif; }
  /* subtle checkered-flag wash behind everything (Mario Kart flavor, whisper-quiet) */
  body::before { content: ""; position: fixed; inset: 0 0 auto 0; height: 340px; pointer-events: none; z-index: 0;
    background: repeating-conic-gradient(currentColor 0% 25%, transparent 0% 50%) 0 0/28px 28px;
    color: var(--ink-1); opacity: .022;
    -webkit-mask-image: linear-gradient(180deg,#000,transparent); mask-image: linear-gradient(180deg,#000,transparent); }
  header, #livewrap, .layout { position: relative; z-index: 1; }

  header { display: flex; align-items: center; gap: 12px; padding: 11px 20px 10px;
           flex-wrap: wrap; background: var(--surface-1);
           border-bottom: 1px solid var(--border); position: relative; }
  header::after { content: ""; position: absolute; left: 0; right: 0; bottom: -3px; height: 3px;
                  background: var(--rainbow); opacity: .85; }
  header h1 { font-size: 18px; margin: 0; font-weight: 800; letter-spacing: .01em; font-style: italic; }
  header h1 .flag { font-style: normal; margin-right: 2px; }
  header .sub { color: var(--ink-2); font-size: 13px; font-weight: 600; }
  header .sub .livemark { color: var(--bad-text); font-weight: 800; }
  header .hbtn { background: var(--tile); border: 1px solid var(--border); color: var(--ink-2);
                 border-radius: 99px; padding: 5px 13px; cursor: pointer; font: inherit; font-weight: 600;
                 transition: transform .12s, box-shadow .12s, color .12s; }
  header .hbtn:hover { transform: translateY(-1px); box-shadow: var(--shadow-1); color: var(--ink-1); }
  header .hbtn.on { color: var(--chip-ink); background: var(--player); border-color: transparent; }
  header .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 99px; overflow: hidden; }
  header .seg button { border: 0; background: var(--tile); color: var(--ink-muted); font: inherit;
                       font-weight: 700; padding: 5px 11px; cursor: pointer; }
  header .seg button.on { background: var(--player); color: var(--chip-ink); }
  header .spacer { margin-left: auto; }
  .lanchip { font-size: 12px; color: var(--ink-2); border: 1px dashed var(--border);
             border-radius: 99px; padding: 4px 11px; background: var(--tile); }

  .layout { display: grid; grid-template-columns: 316px 1fr; gap: 16px;
            padding: 16px 20px; max-width: 1340px; margin: 0 auto; }
  @media (max-width: 940px) { .layout { grid-template-columns: 1fr; } }

  /* ------- chips & badges ------- */
  .badge { font-size: 11.5px; font-weight: 650; padding: 2px 9px; border-radius: 99px;
           border: 1px solid var(--border); color: var(--ink-2); white-space: nowrap;
           background: var(--tile); display: inline-flex; align-items: center; gap: 4px; }
  .badge.won  { color: #fff; background: var(--good-text); border-color: transparent; }
  .badge.lost { color: #fff; background: var(--bad-text);  border-color: transparent; }
  .badge.rec  { color: #4a3200; background: linear-gradient(110deg, #ffd028 30%, #fff3b0 50%, #ffd028 70%);
                background-size: 200% 100%; border-color: transparent; font-weight: 800;
                animation: shine 2.6s linear infinite; }
  @keyframes shine { to { background-position: -200% 0; } }
  .badge.ccb { color: #fff; border-color: transparent; font-weight: 750; letter-spacing: .02em; }
  /* run-confidence chip: at-a-glance "is this run captured correctly?" */
  .conf { font-size: 11px; font-weight: 750; padding: 2px 8px; border-radius: 99px;
          white-space: nowrap; display: inline-flex; align-items: center; gap: 4px;
          border: 1px solid transparent; cursor: help; }
  .conf.cok   { color: var(--good-text); background: color-mix(in srgb, var(--good-text) 15%, transparent);
                border-color: color-mix(in srgb, var(--good-text) 40%, transparent); }
  .conf.cwarn { color: var(--bad-text);  background: color-mix(in srgb, var(--bad-text) 14%, transparent);
                border-color: color-mix(in srgb, var(--bad-text) 40%, transparent); }
  .badge.cc150 { background: var(--cc150); } .badge.cc200 { background: var(--cc200); }
  .badge .bic { height: 13px; }

  /* ------- left column ------- */
  .viewtabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .viewtabs button { flex: 1; background: var(--tile); border: 1px solid var(--border);
                     border-radius: 99px; padding: 7px 0; cursor: pointer; font: inherit;
                     color: var(--ink-2); font-weight: 650; transition: transform .12s, box-shadow .12s; }
  .viewtabs button:hover { transform: translateY(-1px); box-shadow: var(--shadow-1); }
  .viewtabs button.on { color: var(--chip-ink); background: var(--player); border-color: transparent; }
  .filters { display: flex; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; font-size: 12.5px; }
  .filters label { display: inline-flex; gap: 5px; align-items: center; color: var(--ink-2); cursor: pointer; }
  .filters input { accent-color: var(--player); }
  .runlist { display: flex; flex-direction: column; gap: 8px; }
  .sesshead { color: var(--ink-muted); font-size: 11.5px; text-transform: uppercase; font-weight: 700;
              letter-spacing: .07em; margin: 10px 2px 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px;
              white-space: nowrap; }
  .sesshead::after { content: ""; flex: 1 0 100%; height: 1px; margin-top: 4px; background: var(--grid); }
  .sesshead .recap { text-transform: none; letter-spacing: 0; font-weight: 650;
                     color: var(--ink-2); white-space: normal; flex: 1 1 12rem; min-width: 0; }
  .runcard { background: var(--tile); border: 1px solid var(--border); border-radius: 12px;
             padding: 9px 11px; cursor: pointer; display: flex; gap: 10px; align-items: center;
             position: relative; transition: transform .12s, box-shadow .12s, border-color .12s; }
  .runcard:hover { transform: translateY(-1px); box-shadow: var(--shadow-2); }
  .runcard.sel { border-color: var(--player); box-shadow: inset 3px 0 0 var(--player), var(--shadow-1);
                 background: color-mix(in srgb, var(--player) 9%, var(--tile)); }
  .runcard .thumb { width: 74px; height: 42px; border-radius: 8px; object-fit: cover;
                    background: var(--grid); flex: none; }
  .thumb.ph { display: flex; align-items: center; justify-content: center; color: var(--ink-muted);
              font-weight: 800; font-size: 17px;
              background: repeating-conic-gradient(var(--grid) 0% 25%, var(--tile-2) 0% 50%) 0 0/14px 14px; }
  .runcard .track { font-weight: 700; font-size: 13.5px; display: flex; align-items: center; gap: 6px; min-width: 0; }
  .runcard .track .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cupic { height: 17px; flex: none; filter: drop-shadow(0 1px 1px rgba(0,0,0,.25)); }
  .runcard .meta { color: var(--ink-2); font-size: 12px; display: flex; gap: 7px; margin-top: 3px;
                   flex-wrap: wrap; align-items: center; }
  .runcard .meta .t { font-variant-numeric: tabular-nums; font-weight: 650; }
  .runcard .archbtn { position: absolute; top: 4px; right: 6px; border: 0; background: none;
                      color: var(--ink-muted); cursor: pointer; font-size: 13px; padding: 2px; display: none; }
  .runcard:hover .archbtn { display: block; }
  /* a ghost replay in the list: the ghost colour down its edge */
  .runcard.ghostrun { box-shadow: inset 3px 0 0 var(--ghost); }
  .runcard.ghostrun.sel { box-shadow: inset 3px 0 0 var(--player), var(--shadow-1); }
  .v.ghostkart { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 13px; font-weight: 600; }
  .ghostpart { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .runcard.arch { opacity: .55; }

  /* ------- tracks view ------- */
  .trackrow { background: var(--tile); border: 1px solid var(--border); border-radius: 12px;
              padding: 10px 12px; cursor: pointer; transition: transform .12s, box-shadow .12s; }
  .trackrow:hover { transform: translateY(-1px); box-shadow: var(--shadow-2); }
  .trackrow .toprow { display: flex; gap: 8px; align-items: center; min-width: 0; }
  .trackrow .nm { font-weight: 700; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis;
                  white-space: nowrap; flex: 1; }
  .trackrow .pbrow { display: flex; align-items: baseline; gap: 8px; margin-top: 6px; }
  .trackrow .pb { font-size: 19px; font-weight: 800; font-variant-numeric: tabular-nums; font-style: italic; }
  .trackrow .att { color: var(--ink-muted); font-size: 12px; }
  .trackrow .subrow { display: flex; align-items: center; gap: 8px; margin-top: 5px; flex-wrap: wrap;
                      color: var(--ink-2); font-size: 12px; }
  .trackrow .subrow b { font-variant-numeric: tabular-nums; }
  .trackrow svg { flex: none; }
  .wrchip { font-size: 11.5px; font-weight: 700; border-radius: 99px; padding: 1px 8px;
            color: var(--chip-ink); background: var(--ink-muted); font-variant-numeric: tabular-nums; }
  .wrchip.close { background: var(--gold); color: #4a3200; }

  /* ------- detail ------- */
  .detail { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .panel { background: var(--surface-1); border: 1px solid var(--border);
           border-radius: 14px; padding: 16px; box-shadow: var(--shadow-1); }
  .panel h2 { margin: 0 0 10px; font-size: 12.5px; font-weight: 750; color: var(--ink-2);
              text-transform: uppercase; letter-spacing: .07em; display: flex; align-items: center; gap: 8px; }
  .panel h2::before { content: ""; width: 16px; height: 8px; border-radius: 3px; background: var(--rainbow); opacity: .9; }
  .trackbanner { position: relative; border-radius: 13px 13px 0 0; overflow: hidden;
                 margin: -16px -16px 14px; height: 168px; background-size: cover; background-position: center; }
  .trackbanner .shade { position: absolute; inset: 0;
                        background: linear-gradient(180deg, rgba(0,0,0,.08) 10%, rgba(0,0,0,.72)); }
  .trackbanner .tb { position: absolute; left: 16px; right: 16px; bottom: 11px;
                     display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .trackbanner .track { color: #fff; font-size: 22px; font-weight: 800; font-style: italic;
                        text-shadow: 0 1px 8px rgba(0,0,0,.7); display: flex; align-items: center; gap: 9px; }
  .trackbanner .track .cupic { height: 26px; }
  .trackbanner .badge { background: rgba(12,12,16,.55); color: #fff; border-color: rgba(255,255,255,.35);
                        backdrop-filter: blur(3px); }
  .trackbanner .badge.won { background: var(--good-text); border-color: transparent; }
  .trackbanner .badge.lost { background: var(--bad-text); border-color: transparent; }
  .trackbanner .badge.ccb { border-color: transparent; }
  .trackbanner .conf { background: rgba(12,12,16,.72); border-color: rgba(255,255,255,.35); }
  .trackbanner .conf.cok { color: #7dffa6; } .trackbanner .conf.cwarn { color: #ffb3b3; }
  .trackbanner .badge.cc150 { background: var(--cc150); } .trackbanner .badge.cc200 { background: var(--cc200); }
  .trackbanner .when { margin-left: auto; color: rgba(255,255,255,.85); font-size: 12px; font-weight: 600;
                       text-shadow: 0 1px 4px rgba(0,0,0,.8); }
  .titlebar-plain { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .titlebar-plain .track { font-size: 20px; font-weight: 800; font-style: italic;
                           display: flex; align-items: center; gap: 8px; }

  .hero { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
  .hero .portrait { width: 92px; height: 92px; object-fit: contain; flex: none;
                    filter: drop-shadow(0 4px 10px rgba(0,0,0,.3)); }
  .hero .big { font-size: 46px; font-weight: 900; line-height: 1.02; letter-spacing: .01em;
               font-style: italic; font-variant-numeric: tabular-nums; }
  .hero .big.wonc { color: var(--good-text); }
  .hero .big.recc { background: linear-gradient(100deg, var(--gold), #ffe9a0 45%, var(--gold));
                    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero .sub3 { font-size: 13.5px; margin-top: 4px; font-weight: 650; }
  .hero .medal { font-size: 34px; animation: pop .5s ease-out; }
  @keyframes pop { 0% { transform: scale(.3); } 70% { transform: scale(1.2); } 100% { transform: scale(1); } }
  .recap { margin-top: 13px; color: var(--ink-2); font-size: 13.5px; border-top: 1px solid var(--grid); padding-top: 11px; }

  /* ---- cups & tracks overview ---- */
  .cupgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(268px, 1fr));
             gap: 12px; margin-top: 14px; }
  .cupcard { background: var(--tile); border: 1px solid var(--border); border-radius: 14px;
             padding: 10px 12px 8px; }
  .cupcard header { display: flex; align-items: center; gap: 8px; margin-bottom: 7px;
                    padding-bottom: 7px; border-bottom: 1px solid var(--grid); }
  .cupcard header b { font-size: 14px; }
  .cupcard header .cnt { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--ink-muted);
                         font-variant-numeric: tabular-nums; }
  .cupic.big { height: 26px; }
  .ctrack { display: flex; align-items: center; gap: 8px; padding: 4px 2px; font-size: 13px;
            border-radius: 8px; }
  .ctrack img { width: 34px; height: 20px; object-fit: cover; border-radius: 4px; }
  .ctrack i { width: 34px; height: 20px; border-radius: 4px; background: var(--grid); display: inline-block; }
  .ctrack .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ctrack .tm { font-variant-numeric: tabular-nums; font-weight: 700; }
  .ctrack.none { opacity: .5; }
  .ctrack.has .tm { color: var(--player); }
  .ctrack.rec { background: color-mix(in srgb, var(--gold) 14%, transparent); }
  .ctrack .recdot { color: var(--gold); font-size: 13px; }
  .ctrack.beat { background: color-mix(in srgb, var(--good-text) 12%, transparent); }
  .ctrack.goal .tm { min-width: 58px; text-align: right; }
  .ctrack.goal .goalgap { min-width: 58px; text-align: right; font-size: 12px;
                          font-variant-numeric: tabular-nums; font-weight: 750; }
  .ctrack.goal .goalgap.dim { color: var(--ink-muted); font-weight: 650; }
  .ctrack[data-key] { cursor: pointer; }
  .ctrack[data-key]:hover { background: var(--tile-2); }
  .ctrack.beat[data-key]:hover { background: color-mix(in srgb, var(--good-text) 18%, transparent); }
  .ctrack.rec[data-key]:hover { background: color-mix(in srgb, var(--gold) 20%, transparent); }

  /* ---- storage ---- */
  .stwarn { border-radius: 12px; padding: 10px 13px; margin-top: 10px; font-size: 13.5px;
            border: 1px solid var(--border); background: var(--tile); }
  .stwarn.warn { border-color: var(--gold); background: color-mix(in srgb, var(--gold) 12%, transparent); }
  .stwarn.alert { border-color: var(--bad-text); background: color-mix(in srgb, var(--bad-text) 12%, transparent);
                  font-weight: 650; }
  .card { background: var(--tile); border: 1px solid var(--border); border-radius: 14px;
          padding: 12px 14px; margin-top: 12px; }
  .card h3 { margin: 0 0 8px; font-size: 13.5px; color: var(--ink-2); }
  .bar { height: 12px; border-radius: 8px; background: var(--grid); overflow: hidden; }
  .bar .fill { height: 100%; background: var(--player); transition: width .3s ease; }
  .bar .fill.over { background: var(--bad-text); }
  .barlab { display: flex; justify-content: space-between; margin-top: 6px; font-size: 12.5px;
            font-variant-numeric: tabular-nums; font-weight: 650; }
  .barlab .pct { margin-left: 6px; color: var(--player); }
  .caplab { margin-top: 4px; font-size: 12.5px; font-weight: 650; color: var(--ink-2);
            font-variant-numeric: tabular-nums; }
  .setgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px 16px; }
  .setgrid label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px;
                   color: var(--ink-2); font-weight: 600; }
  .setgrid .hint { font-size: 11px; font-weight: 600; color: var(--ink-muted); }
  .setgrid select { padding: 6px 8px; border-radius: 8px; border: 1px solid var(--border);
                    background: var(--bg); color: var(--ink); font: inherit; }
  table.reqtab { width: 100%; border-collapse: collapse; font-size: 12.5px;
                 font-variant-numeric: tabular-nums; }
  table.reqtab th { text-align: right; color: var(--ink-muted); font-weight: 700; padding: 3px 8px;
                    border-bottom: 1px solid var(--grid); }
  table.reqtab th:first-child, table.reqtab td:first-child { text-align: left; }
  table.reqtab td { text-align: right; padding: 4px 8px; border-bottom: 1px solid var(--grid); }
  table.reqtab tr.cur td { background: var(--tile-2); font-weight: 750; }
  table.reqtab .tag { font-style: normal; font-size: 9.5px; font-weight: 800; padding: 1px 5px;
                      border-radius: 999px; background: var(--player); color: var(--chip-ink); }
  .setgrid label.chk { flex-direction: row; align-items: center; gap: 8px; }
  .setgrid input[type=number] { width: 100%; padding: 6px 8px; border-radius: 8px;
                                border: 1px solid var(--border); background: var(--bg);
                                color: var(--ink); font: inherit; font-variant-numeric: tabular-nums; }
  .setgrid .acts { grid-column: 1 / -1; display: flex; gap: 8px; margin-top: 4px; }
  .setgrid .acts button { padding: 7px 14px; border-radius: 9px; border: 1px solid var(--border);
                          background: var(--tile-2); color: var(--ink); font: inherit;
                          font-weight: 700; cursor: pointer; }
  .setgrid .acts button.danger { border-color: var(--bad-text); color: var(--bad-text); }
  .setgrid .acts button:hover { transform: translateY(-1px); }
  .strow { display: flex; align-items: center; gap: 10px; padding: 5px 0; font-size: 12.5px;
           border-bottom: 1px solid var(--grid); }
  .strow:last-child { border-bottom: 0; }
  .strow .f { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
              font-family: ui-monospace, Menlo, Consolas, monospace; }
  .strow .b { font-variant-numeric: tabular-nums; font-weight: 700; }
  .strow .tag { font-style: normal; font-size: 10.5px; font-weight: 800; padding: 2px 6px;
                border-radius: 999px; background: var(--grid); color: var(--ink-2); margin-right: 4px; }
  .strow .tag.record { background: var(--gold); color: var(--chip-ink); }
  .strow .tag.best { background: var(--player); color: var(--chip-ink); }
  .strow .tag.pinned { background: var(--ink-muted); color: var(--chip-ink); }
  .pinbtn { padding: 3px 9px; border-radius: 8px; border: 1px solid var(--border);
            background: var(--tile-2); color: var(--ink-2); font: inherit; font-size: 11.5px;
            font-weight: 700; cursor: pointer; }
  .viewtabs button.warnpulse { border-color: var(--gold); color: var(--gold); }

  .segs { display: flex; gap: 6px; }
  .segs button { background: var(--tile-2); border: 1px solid var(--border); color: var(--ink-2);
                 border-radius: 9px; padding: 5px 12px; font: inherit; font-size: 12.5px;
                 font-weight: 700; cursor: pointer; }
  .segs button.on { background: var(--player); color: var(--chip-ink); border-color: transparent; }
  .segs button.cc150.on { background: var(--cc150); }
  .segs button.cc200.on { background: var(--cc200); }
  .wrcombo { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 12.5px; }
  .wrcombo img { height: 26px; }
  .wrcombo a { color: var(--player); font-weight: 700; text-decoration: none; }
  .verchip { font-size: 12px; font-weight: 700; color: var(--ink-muted); border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px; margin-left: 6px; vertical-align: 3px; }
  .updbar { display: none; margin: 0 16px; padding: 8px 14px; border-radius: 10px; background: hsl(130 60% 45%); color: #fff; font-weight: 700; }
  .updbar a { color: #fff; text-decoration: underline; margin-left: 8px; }
  .focusgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; margin-top: 12px; }
  .focuscard { background: var(--tile); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; display: grid; gap: 6px; }
  .focuscard .fk { font-size: 12px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-muted); }
  .focuscard .ft { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 15px; }
  .focuscard .ft img { width: 44px; height: 28px; object-fit: cover; border-radius: 6px; }
  .focuscard .ft .orig { font-size: 11px; color: var(--ink-muted); font-weight: 800; }
  .focuscard .fh { font-size: 14px; }
  .focuscard .fg { display: inline-block; width: fit-content; border-radius: 8px; padding: 2px 9px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .focuscard .fc { font-size: 12px; color: var(--ink-2); }
  .focuscard .ftimes { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 13px; font-variant-numeric: tabular-nums; }
  .focuscard .ftimes b { font-weight: 800; }
  .focuscard.empty { color: var(--ink-muted); font-size: 13px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 10px; margin-top: 14px; }
  .tile { background: var(--tile); border: 1px solid var(--border); border-radius: 12px; padding: 10px 13px; }
  .tile .k { font-size: 12px; color: var(--ink-2); font-weight: 600; }
  .tile .v { font-size: 21px; font-weight: 800; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .tile .v .of { font-size: 13px; color: var(--ink-muted); font-weight: 600; }
  .d.good { color: var(--good-text); } .d.bad { color: var(--bad-text); }
  .d { font-size: 12.5px; }
  .itemic { height: 19px; vertical-align: -5px; margin-right: 4px; }
  .aborted-note { background: var(--tile); border: 1px dashed var(--border); border-radius: 12px;
                  padding: 12px 14px; color: var(--ink-2); margin-top: 12px; }

  /* lap table */
  table.laps { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.laps th { text-align: right; color: var(--ink-muted); font-weight: 700; padding: 4px 10px;
                  border-bottom: 2px solid var(--grid); font-size: 11.5px; text-transform: uppercase;
                  letter-spacing: .04em; }
  table.laps th:first-child { text-align: left; }
  table.laps td { padding: 5px 10px; border-bottom: 1px solid var(--grid);
                  font-variant-numeric: tabular-nums; text-align: right; }
  table.laps td:first-child { text-align: left; color: var(--ink-2); font-weight: 650; white-space: nowrap; }
  table.laps tbody tr:hover td { background: var(--tile-2); }
  table.laps tr.total td { font-weight: 800; border-top: 2px solid var(--baseline); border-bottom: 0;
                           font-size: 14px; }
  table.laps .best { color: var(--gold); font-weight: 750; white-space: nowrap; }
  table.laps td.mslot { width: 20px; padding: 4px 1px; text-align: center; }
  table.laps th.mhead { text-align: center; }
  table.laps .cplus { color: var(--good-text); width: 40px; }
  table.laps .cmin { color: var(--bad-text); width: 40px; }
  table.laps .cend { font-weight: 700; width: 46px; }
  table.laps th.cplus, table.laps th.cmin { font-size: 13px; font-weight: 800; }
  .shroomdot { height: 15px; vertical-align: -3px; }
  .lapswrap { overflow-x: auto; }
  .obanner { object-fit: contain; filter: drop-shadow(0 2px 4px rgba(0,0,0,.35)); vertical-align: middle; }

  /* loadouts — APK design language (buildDesignResultPanel): yellow YOU /
     off-white ghost, per-part accent borders, amber "?" for unsure fields */
  :root { --apk-you: #d9a621; --apk-ghost: #7f8b99; --apk-amber: #b96f00;
          --acc-character: #f59e0b; --acc-kart: #3b82f6;
          --acc-wheel: #22c55e; --acc-glider: #a855f7; }
  :root[data-theme="dark"] { --apk-you: #f6c945; --apk-ghost: #cdd6e0; --apk-amber: #ffc878; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --apk-you: #f6c945; --apk-ghost: #cdd6e0; --apk-amber: #ffc878; }
  }
  .loadouts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 720px) { .loadouts { grid-template-columns: 1fr; } }
  .loadout { background: var(--tile); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px;
             border-top: 3px solid var(--border); }
  .loadout.p { border-top-color: var(--apk-you); }
  .loadout.g { border-top-color: var(--apk-ghost); }
  .loadout .who { font-weight: 750; display: flex; align-items: center; gap: 7px; }
  .loadout .who .tag { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em;
                       border-radius: 99px; padding: 1.5px 9px; }
  .loadout.p .who .tag { background: var(--apk-you); color: #3a2d00; }
  .loadout.g .who .tag { background: var(--apk-ghost); color: #1a2029; }
  .loadout .who .flagic { margin-left: auto; height: 20px; border-radius: 3px; border: 1px solid var(--border); }
  .swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
  .parttiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
  .ptile { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 0; }
  .ptile .pk { font-size: 9.5px; font-weight: 700; text-transform: uppercase;
               letter-spacing: .06em; color: var(--ink-muted); }
  .ptile .pbox { width: 58px; height: 44px; border-radius: 8px; background: var(--tile-2);
                 border: 2px solid var(--border); display: flex; align-items: center;
                 justify-content: center; }
  .ptile.character .pbox { border-color: var(--acc-character); }
  .ptile.kart .pbox { border-color: var(--acc-kart); }
  .ptile.wheel .pbox { border-color: var(--acc-wheel); }
  .ptile.glider .pbox { border-color: var(--acc-glider); }
  .ptile .pbox img { max-width: 48px; max-height: 36px; object-fit: contain; }
  .ptile .pn { font-size: 11px; font-weight: 700; text-align: center; max-width: 100%;
               overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ptile .pn.unsure2 { color: var(--apk-amber); }
  .ptile .ps { font-size: 9.5px; color: var(--ink-muted); font-variant-numeric: tabular-nums; }
  .unsure { font-size: 10.5px; color: var(--bad-text); border: 1px solid currentColor;
            border-radius: 99px; padding: 0 6px; margin-left: 6px; vertical-align: 1px; }
  .evlink { font-size: 12px; color: var(--ink-muted); cursor: pointer; text-decoration: underline dotted; }
  .evlink:hover { color: var(--ink-1); }
  .evimg { width: 100%; border-radius: 8px; border: 1px solid var(--border); margin-top: 8px; }

  /* combined stats */
  .cmpstats { margin-top: 14px; }
  .cmpstats .legend2 { display: flex; gap: 10px; align-items: center; margin-bottom: 7px;
                       font-size: 12px; color: var(--ink-2); font-weight: 650; }
  .cmpstats .sb { display: grid; grid-template-columns: 82px 1fr 78px; gap: 10px; align-items: center;
                  font-size: 12px; color: var(--ink-2); padding: 3px 0; font-weight: 600; }
  .cmpstats .bars { position: relative; height: 17px; }
  .cmpstats .bars.solo { height: 9px; }
  /* stacked bars: each stat is built from the character/body/tire/glider
     contribution, in the same accent colors as the tile borders (APK) */
  .cmpstats .brow { position: absolute; left: 0; right: 0; height: 7px;
                    border-radius: 4px; overflow: hidden; }
  .cmpstats .brow.p { top: 0; }
  .cmpstats .brow.g { bottom: 0; opacity: .6; }
  .cmpstats .bars.solo .brow.p { top: 1px; }
  .cmpstats .seg { position: absolute; top: 0; bottom: 0; }
  .cmpstats .seg.k0 { background: var(--acc-character); }
  .cmpstats .seg.k1 { background: var(--acc-kart); }
  .cmpstats .seg.k2 { background: var(--acc-wheel); }
  .cmpstats .seg.k3 { background: var(--acc-glider); }
  .cmpstats .tick2 { position: absolute; top: -2px; bottom: -2px; width: 1px;
                     background: var(--baseline); opacity: .55; }
  .cmpstats .cap { position: absolute; top: -2px; bottom: -2px; width: 2px; border-radius: 2px; background: var(--baseline); }
  .cmpstats .v { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-muted); }
  .samenote { font-size: 12px; color: var(--ink-muted); margin-top: 8px; }

  /* records */
  .recrow { display: flex; gap: 12px; align-items: center; padding: 8px 0;
            border-bottom: 1px solid var(--grid); font-size: 13.5px; flex-wrap: wrap; }
  .recrow:last-of-type { border-bottom: 0; }
  .recrow .ric { width: 22px; text-align: center; flex: none; }
  .recrow .lbl { width: 128px; color: var(--ink-2); flex: none; font-weight: 650; }
  .recrow .t { font-variant-numeric: tabular-nums; font-weight: 750; }
  .recrow .gap { font-variant-numeric: tabular-nums; font-size: 12.5px; font-weight: 700;
                 border-radius: 99px; padding: 1px 9px; background: var(--tile); border: 1px solid var(--border); }
  .recrow .gap.ahead { color: #fff; background: var(--good-text); border-color: transparent; }
  .recrow .who2 { color: var(--ink-muted); font-size: 12.5px; }

  .legend { display: flex; gap: 16px; font-size: 12.5px; color: var(--ink-2); margin-bottom: 6px;
            flex-wrap: wrap; font-weight: 600; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  svg text { font: 11px "Segoe UI", system-ui, sans-serif; fill: var(--ink-muted); }
  svg .tick { font-variant-numeric: tabular-nums; }
  .chartwrap { position: relative; }
  .tooltip { position: absolute; pointer-events: none; display: none; z-index: 5;
             background: var(--tile); border: 1px solid var(--border); border-radius: 10px;
             padding: 7px 10px; font-size: 12.5px; box-shadow: var(--shadow-2); white-space: nowrap; }
  .tooltip b { font-variant-numeric: tabular-nums; }

  table.events { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.events th { text-align: left; color: var(--ink-muted); font-weight: 700; padding: 5px 8px;
                    border-bottom: 2px solid var(--grid); font-size: 11.5px; text-transform: uppercase;
                    letter-spacing: .04em; }
  table.events td { padding: 3.5px 8px; border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; }
  table.events .em { display: inline-flex; width: 24px; justify-content: center; vertical-align: middle; }
  table.events .em img { max-width: 21px; max-height: 21px; vertical-align: middle; }
  .empty { color: var(--ink-2); padding: 40px; text-align: center; }
  details.evd summary { cursor: pointer; color: var(--ink-2); font-size: 13px; font-weight: 650; }
  details.evd summary:hover { color: var(--ink-1); }
  .actions { display: flex; gap: 8px; margin-top: 13px; flex-wrap: wrap; }
  .actions button { background: var(--tile); border: 1px solid var(--border); color: var(--ink-2);
                    border-radius: 99px; padding: 6px 14px; cursor: pointer; font: inherit; font-weight: 650;
                    transition: transform .12s, box-shadow .12s, color .12s; }
  .actions button:hover { color: var(--ink-1); transform: translateY(-1px); box-shadow: var(--shadow-1); }

  /* live panel */
  #livewrap { max-width: 1340px; margin: 0 auto; padding: 16px 20px 0; }
  .livehead { display: flex; align-items: center; gap: 10px; font-weight: 650; flex-wrap: wrap; }
  .livedot { width: 9px; height: 9px; border-radius: 50%; background: var(--bad-text);
             animation: pulse 1.4s infinite; flex: none; }
  @keyframes pulse { 50% { opacity: .35; } }
  .livelabel { font-weight: 800; letter-spacing: .04em; font-style: italic; }
  .livephase { color: var(--chip-ink); font-weight: 700; font-size: 12.5px; border-radius: 99px;
               padding: 3px 12px; background: var(--state-menu); transition: background .3s; }
  .livephase.armed { background: var(--state-armed); animation: pulse 1s infinite; }
  .livephase.racing { background: var(--state-racing); }
  .livephase.reading { background: var(--state-reading); }
  .liveclock { font-variant-numeric: tabular-nums; color: var(--player); font-weight: 900;
               font-size: 21px; font-style: italic; }
  .liverow { display: grid; grid-template-columns: minmax(300px, 520px) 1fr; gap: 16px; margin-top: 12px; }
  @media (max-width: 820px) { .liverow { grid-template-columns: 1fr; } }
  /* DIRECT child only: the black letterbox is for the preview image. Without the
     child combinator this also matched the nested ticker icon <img>s, painting a
     black box behind their transparent alpha (the .ticker .em img rule resets
     size but not background). */
  .liverow > img { width: 100%; border-radius: 10px; border: 1px solid var(--border); background: #000;
                 aspect-ratio: 16/9; object-fit: contain; box-shadow: var(--shadow-1); }
  .ticker { max-height: min(520px, calc(100vh - 260px)); overflow-y: auto; font-size: 13px; }
  .ticker div { padding: 3.5px 0; border-bottom: 1px solid var(--grid); display: flex; gap: 10px;
                align-items: baseline; }
  .ticker .tt { color: var(--ink-muted); font-variant-numeric: tabular-nums; min-width: 52px; flex: none; }
  /* fixed-size icon slot: every icon (emoji OR asset img) occupies the SAME box so
     rows line up — the wide Boo and the tall coin both fit the same 28x24 cell.
     Sized up for legibility ("clearly readable at a glance") while staying tidy. */
  .ticker .em { flex: none; width: 28px; height: 24px; display: inline-flex;
                align-items: center; justify-content: center; font-size: 19px; line-height: 1; }
  .ticker .em img { max-width: 24px; max-height: 24px; width: auto; height: auto; object-fit: contain; }
  .ticker .waiting { color: var(--ink-muted); border-bottom: 0; font-style: italic; }
  /* event rows: thin accent bar keyed to event category + one bold key value */
  .ticker .tk { align-items: center; min-height: 26px; border-left: 3px solid var(--baseline);
                padding-left: 8px; border-radius: 2px; }
  .ticker .tk .msg { color: var(--ink-2); }
  .ticker .tk b { font-weight: 800; color: var(--ink-1); }
  .ticker .tk .dim, .ticker .tk .arw { color: var(--ink-muted); font-weight: 400; }
  .ticker .tk b.g   { color: var(--gold); }
  .ticker .tk b.win { color: var(--good-text); }
  .ticker .tk b.bad { color: var(--bad-text); }
  .ticker .tk b.cc150 { color: var(--cc150); }
  .ticker .tk b.cc200 { color: var(--cc200); }
  .tk-go     { border-left-color: var(--state-racing) !important; }
  .tk-count  { border-left-color: var(--state-armed) !important; }
  .tk-lap    { border-left-color: var(--player) !important; }
  .tk-coin   { border-left-color: var(--gold) !important; }
  /* "now on lap N" is a position, not a result — it must not compete with the
     lap REPORT directly above it, which is the row carrying the times */
  .tk-lapnow { border-left-color: var(--grid) !important; opacity: .62; }
  .tk-lapnow .msg { font-size: 92%; }
  .tk-pause  { border-left-color: var(--state-armed) !important; }
  .tk-mush   { border-left-color: var(--ghost) !important; }
  .tk-finish { border-left-color: var(--state-reading) !important; }
  .tk-win    { border-left-color: var(--good-text) !important; }
  .tk-lost   { border-left-color: var(--bad-text) !important; }
  .tk-track  { border-left-color: var(--player) !important; }
  .tk-cc150  { border-left-color: var(--cc150) !important; }
  .tk-cc200  { border-left-color: var(--cc200) !important; }
  .tk-mode   { border-left-color: var(--ghost) !important; }
  .tk-rec    { border-left-color: var(--gold) !important;
               background: linear-gradient(90deg, color-mix(in srgb, var(--gold) 20%, transparent), transparent); }
  .tickempty { display: flex; flex-direction: column; gap: 7px; justify-content: center;
               height: 100%; min-height: 180px; color: var(--ink-muted); font-size: 13px; }
  .tickempty .step { display: flex; gap: 9px; align-items: center; }
  .tickempty .step .n { width: 20px; height: 20px; border-radius: 50%; background: var(--tile);
                        border: 1px solid var(--border); display: inline-flex; align-items: center;
                        justify-content: center; font-size: 11px; font-weight: 700; flex: none; }
  .chips { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .recbtn { background: none; border: 1.5px solid var(--bad-text); color: var(--bad-text);
            border-radius: 99px; padding: 3px 13px; font: inherit; font-weight: 800;
            cursor: pointer; font-variant-numeric: tabular-nums; }
  .recbtn.on { background: var(--bad-text); color: #fff; border-color: transparent;
               animation: pulse 1.2s infinite; }
  .pillbtn { background: var(--tile); border: 1px solid var(--border); color: var(--ink-2);
             border-radius: 99px; padding: 3px 12px; cursor: pointer; font: inherit;
             font-weight: 650; font-size: 12.5px; }
  .pillbtn.on { background: var(--player); color: var(--chip-ink); border-color: transparent; }
  .clips { display: flex; gap: 8px; margin-top: 9px; flex-wrap: wrap; font-size: 12px; align-items: center; }
  .cliplink { color: var(--ink-2); text-decoration: none; border: 1px solid var(--border);
              border-radius: 99px; padding: 2px 11px; background: var(--tile);
              font-variant-numeric: tabular-nums; }
  .cliplink:hover { color: var(--ink-1); border-color: var(--ink-muted); }
  /* ghost panel: the card the engine read by itself */
  .lvghost:empty { display: none; }
  .lvghost { margin-top: 10px; }
  .gcard { padding: 10px 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--page);
           display: grid; gap: 8px; min-width: 0; }
  .gcard .ghead { font-size: 11px; font-weight: 800; letter-spacing: .06em; color: var(--gold); text-transform: uppercase; }
  .gcard .gwho { display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap; min-width: 0; }
  .gcard .gchar { width: 40px; height: 40px; object-fit: contain; }
  .gcard .flagic { height: 22px; width: auto; }
  .gcard .gname { font-weight: 800; font-size: 16px; overflow-wrap: anywhere; }
  .gcard .gtotal { font-weight: 800; font-size: 16px; font-variant-numeric: tabular-nums; }
  .gcard .gstate { color: var(--ink-muted); font-size: 12px; font-weight: 650; }
  .gcard .glaps { display: flex; gap: 6px 14px; flex-wrap: wrap; font-variant-numeric: tabular-nums; font-weight: 650; }
  .gcard .gl { display: inline-flex; align-items: center; gap: 6px; }
  .gcard .gli { width: 18px; height: 18px; border-radius: 50%; background: var(--tile); border: 1px solid var(--border);
                display: inline-grid; place-items: center; font-size: 11px; font-weight: 800; }
  .gcard .gparts { display: flex; gap: 6px 14px; flex-wrap: wrap; }
  .gcard .gpart { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
  .gcard .gpart img { width: 34px; height: 24px; object-fit: contain; }

  @media print {
    header, .runlist, #livewrap, .viewtabs, .filters, .actions, details.evd, .archbtn { display: none !important; }
    .layout { display: block; padding: 0; }
    .panel { border: 1px solid #ccc; break-inside: avoid; margin-bottom: 10px; box-shadow: none; }
    body { background: #fff; }
    body::before { display: none; }
  }
  /* App views: Live shows only the live block (large picture, a summary line that
     lights up on every trigger, all engine detail one click away); Run history
     shows everything but the live block. */
  html[data-view="live"] header, html[data-view="live"] .updbar,
  html[data-view="live"] .layout { display: none !important; }
  html[data-view="history"] #livewrap { display: none !important; }
  html[data-view="live"], html[data-view="live"] body { overflow: hidden; min-height: 0; background: transparent; }
  html[data-view="live"] #livewrap { max-width: none; padding: 0; display: flow-root; }
  .livehero { margin-top: 12px; position: relative; }
  /* Until the first frame arrives: a black 16:9 box that says so, never a broken-image icon. */
  .livehero img:not([src]) { visibility: hidden; }
  .livehero:has(img:not([src]))::after { content: attr(data-wait); position: absolute; inset: 0; display: grid;
    place-items: center; color: #c9cde0; font-weight: 700; }
  .livehero img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: contain; background: #000;
                  border-radius: 12px; border: 1px solid var(--border); }
  .livesum { display: flex; align-items: center; gap: 12px 18px; flex-wrap: wrap; margin-top: 12px;
             padding: 10px 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--page); }
  .livesum.flash { animation: trigflash 1.4s ease-out; }
  @keyframes trigflash { 0% { box-shadow: 0 0 0 3px var(--gold), 0 0 28px var(--gold); background: var(--surface-1); }
                         100% { box-shadow: 0 0 0 0 transparent; } }
  .livesum .ltrack { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 16px; }
  .livesum .langchip { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; white-space: nowrap; }
  .livesum .langchip img { height: 16px; width: auto; border-radius: 2px; }
  .livesum .tthumb { width: 104px; height: 58px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); }
  .livesum .tcup { width: 30px; height: 30px; object-fit: contain; }

const fmtT = ms => {
  if (ms == null) return "—";
  const s = ms / 1000, m = Math.floor(s / 60);
  return `${m}:${(s - m * 60).toFixed(3).padStart(6, "0")}`;
};
const fmtD = ms => (ms >= 0 ? "+" : "−") + fmtT(Math.abs(ms));
const fmtDs = fmtD;  // all deltas in x:xx.xxx (user preference)
const GAP_RED_MS = 6000;      // this far behind (or more) is fully red
const GAP_GREEN_MS = 3000;    // this far ahead (or more) is fully green
function gapHue(ms) {
  if (ms == null) return null;
  if (ms <= 0) return 130;                                   // ahead: green
  const t = Math.min(1, ms / GAP_RED_MS);
  return Math.round(45 * (1 - t));                            // behind: amber -> red
}
function gapStyle(ms) {
  const h = gapHue(ms);
  if (h == null) return "";
  const strength = ms <= 0 ? Math.min(1, -ms / GAP_GREEN_MS) : Math.min(1, ms / GAP_RED_MS);
  // Solid chip, white text: a tinted text on a tinted background of the same
  // hue was unreadable (owner 2026-09-07). Strength deepens the chip.
  const sat = 60 + Math.round(30 * strength);
  const light = 48 - Math.round(12 * strength);
  return `color:#fff;font-weight:800;background:hsl(${h} ${sat}% ${light}%)`;
}
function gapRowStyle(ms) {
  const h = gapHue(ms);
  if (h == null) return "";
  const strength = ms <= 0 ? Math.min(1, -ms / GAP_GREEN_MS) : Math.min(1, ms / GAP_RED_MS);
  return `background:linear-gradient(90deg, transparent 55%, hsl(${h} 70% 50% / ${(0.06 + 0.16 * strength).toFixed(2)}))`;
}

};

// "Do we know this run is good?" — a green/amber confidence chip from signals the
// pipeline already produces. Green = accepted AND the player lap times SUM to the

// so you don't have to guess. Amber = finished but the sum didn't close: worth a
// glance. Aborted / in-progress runs get no chip (handled elsewhere).
function trackConfidence(r) {
  if (!r || r.aborted || !r.finished) return null;
  const res = r.results || {}, p = res.player || {}, g = res.ghost;
  const sumOk = p.lapSumOk === true && (!g || g.lapSumOk !== false);
  return (res.accepted === true && sumOk)
    ? { cls: "cok", icon: "✓", txt: T("trackVerified"), tip: T("trackVerifiedTip") }
    : { cls: "cwarn", icon: "!", txt: T("trackCheck"), tip: T("trackCheckTip") };
}

const sameResult = (a, b) => trackId(a) === trackId(b)
  && String((a.context || {}).cc) === String((b.context || {}).cc)
  && ((a.results || {}).player || {}).totalMs === ((b.results || {}).player || {}).totalMs;
const countedRuns = () => DATA.runs.concat((DATA.ghostRuns || []).filter(g =>
  (g.ghostReplay || {}).mine && !DATA.runs.some(r => !r.aborted && sameResult(r, g))));

  (FILT.showArchived || !r.archived) && (!FILT.finishedOnly || !r.aborted))

// Events are indexed by wall time since GO. Lap boundaries come from the result
// card, which is pure RACE time — the game clock stops while paused. The two
// agree only when nobody paused, and diverge by the whole pause when someone
// did: after a 6-minute pause every coin landed past the end of a 79-second
// run, so the timeline drew them off the chart and every one of them was
// attributed to the last lap. e.race is t with the pause removed
// (engine._stamp_race_time); runs recorded before that have no pause either,
// so falling back to t is exact, not a guess.
const raceT = e => (e.race != null ? e.race : e.t);

function coinsPerLap(r) {
  const n = r.lapCount;
  const evs = (r.events || []).slice().sort((a, b) => raceT(a) - raceT(b));
  const lapT = lapBoundaries(r).map(l => l.t);  // result-splits first, lap events fallback
  const laps = [0].concat(lapT);
  const gained = Array(n).fill(0), lost = Array(n).fill(0), shrooms = Array(n).fill(0);
  const endCnt = Array(n).fill(null);
  const lapAt = t => { let li = 0; for (let i = 0; i < laps.length; i++) if (laps[i] <= t) li = i; return Math.min(li, n - 1); };
  let cur = 0, bi = 0;
  for (const e of evs) {
    // passing a lap boundary: the running count is that lap's end count
    while (bi < lapT.length && raceT(e) >= lapT[bi]) { endCnt[Math.min(bi, n - 1)] = cur; bi++; }
    if (e.type === "coin") {
      const d = e.to - e.from;
      if (d > 0) gained[lapAt(raceT(e))] += d; else if (d < 0) lost[lapAt(raceT(e))] += -d;
      cur = e.to;
    }
    // mushrooms used per lap = the count DECREASE, not the use-trigger
    // ANIMATION. A rapid triple-fire flashes the "using" animation by too fast
    // to match (so mushroom_use_3to2/2to1 are missed), but the mushroom COUNTER
    // still steps down — which is why the graph shows the drop while the table
    // used to undercount. The count-state events carry the drop (from-to); the
    // final 1->0 arrives as the ring-exit. Same source as the graph, so they agree.
    if (e.type === "mushrooms") shrooms[lapAt(raceT(e))] += Math.max(0, e.from - e.to);
    else if (e.type === "mushroom_use_1to0_ring_exit") shrooms[lapAt(raceT(e))] += 1;
  }
  while (bi < lapT.length) { endCnt[Math.min(bi, n - 1)] = cur; bi++; }
  endCnt[n - 1] = cur;
  return { gained, lost, endCnt, shrooms, coins: gained };
}

  // Rebuild the detail panel only when the SELECTED run's data (or selection/
  // view/lang/expert) changed. Without this, any OTHER run finishing during a
  // live session re-rendered the whole panel — recreating the clip <video>
  // (playback jumps to 0), collapsing the event-log <details>, and clearing
  // text selection. The left list still rebuilds every render (it's cheap).
  const detailKey = r
    ? [runKey(r), VIEW, LANG, EXPERT ? 1 : 0, (r.events || []).length, r.clipFile || "",
       r.endscreenFile || "",
       JSON.stringify(r.results || {}), JSON.stringify(r.identity || {})].join("|")
    : "empty|" + LANG;
  if (detailKey !== LAST_DETAIL_KEY || FORCE_RENDER) {
    LAST_DETAIL_KEY = detailKey;
    document.getElementById("detail").innerHTML = r ? detailHtml(r) : `<div class="empty">${T("noRuns")}</div>`;
    if (r) wireTimeline(r);
  }
}

/* capturedAt is the SESSION's clock, so every run in one recording shares it to
   the microsecond; ordering on it alone makes sibling runs mutually "not
   earlier" and no PB is ever credited within a session. The run index breaks
   the tie — it is monotonic within a report by construction. */
const runOrd = r => [r.capturedAt || 0, r.run || 0];
const before = (a, b) => a[0] !== b[0] ? a[0] < b[0] : a[1] < b[1];

/* One line per session day. A PB here means "beat everything recorded on that
   track/cc/category BEFORE this run" — comparing against the all-time best would
   credit only the last run of a session that improved five times. */
function recapHtml(runs, day) {
  const mine = runs.filter(r => dayLabel(r.capturedAt) === day && !r.archived && !r.ghostReplay);
  if (!mine.length) return "";
  const done = mine.filter(r => !r.aborted && ((r.results || {}).player || {}).totalMs != null);
  let pbs = 0, gain = 0;
  for (const r of done) {
    const tid = trackId(r), cc = (r.context || {}).cc, cat = catOf(r);
    const t = r.results.player.totalMs;
    // every earlier attempt, session or not — capturedAt is the ordering
    const prior = countedRuns().filter(x => !x.aborted && !x.archived && trackId(x) === tid
      && ((x.context || {}).cc) === cc && catOf(x) === cat
      && before(runOrd(x), runOrd(r)) && ((x.results || {}).player || {}).totalMs != null)
      .map(x => x.results.player.totalMs);
    if (!prior.length) continue;
    const was = Math.min(...prior);
    if (t < was) { pbs++; gain += was - t; }
  }
  const drive = done.reduce((a, r) => a + (r.results.player.totalMs || 0), 0);
  const bits = [`${mine.length} ${T("attempts").toLowerCase()}`,
                `${done.length}/${mine.length} ${T("finished").toLowerCase()}`];
  if (pbs) bits.push(`🏅 ${pbs} PB${pbs > 1 ? "s" : ""} (${fmtDs(-gain)})`);
  if (drive) bits.push(`⏱ ${fmtT(drive)}`);
  return `<span class="recap">${bits.join(" · ")}</span>`;
}

/* =============== competitive analytics =============== */
/* Shortcut vs no-shortcut is a different EVENT, not a variation: aggregating
   them together would call an SC run your PB on an NSC board. Every aggregate
   below is keyed by track|cc|category. */
const CATS = ["nsc", "sc"];
const catOf = r => r.category || "nsc";

function stats(vals) {
  if (!vals.length) return null;
  const v = [...vals].sort((a, b) => a - b);
  const mean = v.reduce((a, b) => a + b, 0) / v.length;
  const sd = Math.sqrt(v.reduce((a, b) => a + (b - mean) ** 2, 0) / v.length);
  return { n: v.length, best: v[0], median: v[Math.floor(v.length / 2)], worst: v[v.length - 1],
           mean, sd, spread: v[v.length - 1] - v[0] };
}

/* per-lap consistency + where the time goes vs your own best lap */
function lapStats(runs, n) {
  const cols = Array.from({ length: n }, () => []);
  for (const r of runs) {
    const l = ((r.results || {}).player || {}).lapTimesMs;
    if (l && l.length === n && l.every(v => v != null)) l.forEach((v, i) => cols[i].push(v));
  }
  return cols.map(c => stats(c)).filter(Boolean);
}

/* gap to the ghost per lap — exact, from both owners' result cards (the in-race
   HUD delta only gives the sign, and only while you are driving) */
function ghostSplits(r) {
  const p = ((r.results || {}).player || {}).lapTimesMs;
  const g = ((r.results || {}).ghost || {}).lapTimesMs;
  if (!p || !g || p.length !== g.length || p.some(v => v == null) || g.some(v => v == null)) return null;
  let cum = 0;
  return p.map((v, i) => { cum += v - g[i]; return { lap: i + 1, d: v - g[i], cum }; });
}

function analyticsPanel(r) {
  const tid = trackId(r), cc = (r.context || {}).cc, cat = catOf(r);
  const p = (r.results || {}).player;
  if (!tid || !p || p.totalMs == null) return "";
  const peers = countedRuns().filter(x => !x.aborted && !x.archived && trackId(x) === tid
    && ((x.context || {}).cc) === cc && catOf(x) === cat
    && ((x.results || {}).player || {}).totalMs != null);
  const st = stats(peers.map(x => x.results.player.totalMs));
  const ls = lapStats(peers, r.lapCount);
  const gs = ghostSplits(r);
  if (!st) return "";
  const theo = ls.length === r.lapCount ? ls.reduce((a, s) => a + s.best, 0) : null;
  let h = `<div class="panel"><h2>📊 ${T("analytics")} <span class="dim">${T(cat)}</span></h2>
    <div class="tiles">
      <div class="tile"><div class="k">${T("attempts")}</div><div class="v">${st.n}</div></div>
      <div class="tile"><div class="k">${T("personalBest")}</div><div class="v">${fmtT(st.best)}</div></div>
      <div class="tile"><div class="k">${T("aMedian")}</div><div class="v">${fmtT(st.median)}</div></div>
      <div class="tile"><div class="k">${T("aConsistency")}</div><div class="v">±${(st.sd / 1000).toFixed(2)}s</div></div>
      ${theo != null ? `<div class="tile"><div class="k">${T("theoBest")}</div><div class="v">${fmtT(theo)}
        <span class="of">${fmtDs(theo - st.best)}</span></div></div>` : ""}
    </div>`;
  if (ls.length === r.lapCount) {
    h += `<table class="laps" style="margin-top:10px"><tr><th>${T("lap")}</th><th>${T("thisRun")}</th>
      <th>${T("yourBest")}</th><th>${T("lost")}</th><th>${T("aSpread")}</th>${gs ? `<th>${T("vsGhost")}</th>` : ""}</tr>`;
    ls.forEach((s, i) => {
      const mine = (p.lapTimesMs || [])[i];
      h += `<tr><td>${i + 1}</td><td>${mine != null ? fmtT(mine) : "—"}</td><td>${fmtT(s.best)}</td>
        <td class="${mine != null && mine - s.best > 0 ? "cmin" : "cplus"}">${mine != null ? fmtDs(mine - s.best) : "—"}</td>
        <td class="dim">±${(s.sd / 1000).toFixed(2)}s</td>
        ${gs ? `<td class="${gs[i].d <= 0 ? "cplus" : "cmin"}">${fmtDs(gs[i].d)}</td>` : ""}</tr>`;
    });
    h += `</table>`;
  }
  return h + `</div>`;
}

/* =============== goals =============== */
/* Coverage is not the goal a competitive player sets. "Staff ghost beaten on
   every course" is — and the staff times are already in the database. */
const WR_GOAL_WINDOW_MS = 10000;

function goalIndex(cc) {
  const out = {};
  for (const [tid, t] of Object.entries((META || {}).tracks || {})) {
    const rec = ((META.records || {})[tid] || {})[cc] || {};
    out[tid] = { tid, name: locName(t), icon: t.icon || null,
                 staff: (rec.staff || {}).timeMs || null,
                 wr: (rec.wr || {}).timeMs || null, best: null, bestRun: null, cup: t.cup };
  }
  for (const r of countedRuns()) {
    if (r.aborted || r.archived) continue;
    const tid = trackId(r), p = ((r.results || {}).player || {});
    if (!tid || p.totalMs == null || String((r.context || {}).cc || "") !== String(cc)) continue;
    const e = out[tid];
    if (e && (e.best == null || p.totalMs < e.best)) { e.best = p.totalMs; e.bestRun = r; }
  }
  // The Player's published record on the site counts as a best too: a
  // goal met before this PC existed is still met (owner ask 2026-09-07).
  for (const [tid, e] of Object.entries(out)) {
    const ref = refFor(tid, cc);
    if (ref && ref.pb != null && (e.best == null || ref.pb < e.best)) { e.best = ref.pb; e.bestRun = null; e.fromSite = true; }
    // The nearest rival: the slowest rival still ahead of the best, or, when
    // no rival is ahead, the fastest one behind. Without a best of our own the
    // fastest rival is the time to reach.
    const others = ref && ref.others ? ref.others : [];
    e.rival = null;
    if (others.length) {
      const ahead = e.best == null ? others : others.filter(o => o.timeMs < e.best);
      const pick = ahead.length ? ahead[ahead.length - 1] : others[0];
      e.rival = { timeMs: pick.timeMs, name: pick.name, ahead: ahead.length > 0 };
      e.rivalsAhead = ahead.length;
    }
  }
  return out;
}

function goalsHtml() {
  if (!META) return `<div class="empty">…</div>`;
  const cc = GOALCC, target = GOALTARGET;
  const idx = goalIndex(cc);
  const all = Object.values(idx);
  const withTime = all.filter(e => e.best != null);
  const beatStaff = withTime.filter(e => e.staff != null && e.best < e.staff);
  const closeWr = withTime.filter(e => e.wr != null
    && e.best - e.wr >= 0 && e.best - e.wr <= WR_GOAL_WINDOW_MS);
  const leadRivals = withTime.filter(e => e.rival && e.rivalsAhead === 0);
  const pct = n => Math.round(100 * n / all.length);
  const targetLabel = target === "wr" ? T("goalWr10") : target === "rival" ? T("goalRivalsBeat") : T("goalStaffBeat");
  const targetCount = target === "wr" ? closeWr.length : target === "rival" ? leadRivals.length : beatStaff.length;
  let h = `<div class="dhead"><h2>🎯 ${T("goals")}${REF && REF.displayName ? ` <small class="dim">· ${T("refFor")} ${esc(REF.displayName)} · ☁ ${esc(T("fromSite"))}</small>` : ""}</h2>
    <div class="segs">${[["150", "150cc"], ["200", "200cc"]].map(([v, n]) =>
      `<button class="cc${v} ${cc === v ? "on" : ""}" onclick="GOALCC='${v}';FORCE_RENDER=true;render()">${n}</button>`).join("")}
      ${[["staff", T("goalStaff")], ["wr", T("goalWorld")], ["rival", T("goalRivals")]].map(([v, n]) =>
        `<button class="${target === v ? "on" : ""}" onclick="GOALTARGET='${v}';FORCE_RENDER=true;render()">${n}</button>`).join("")}</div>
    <div class="tiles">
      <div class="tile"><div class="k">${T("gHasTime")}</div><div class="v">${withTime.length}
        <span class="of">/ ${all.length} · ${pct(withTime.length)}%</span></div></div>
      <div class="tile"><div class="k">${targetLabel}</div><div class="v">${targetCount}
        <span class="of">/ ${all.length} · ${pct(targetCount)}%</span></div></div>
    </div></div><div class="cupgrid">`;
  const cups = {};
  for (const [tid, t] of Object.entries((META || {}).tracks || {})) {
    const c = t.cup || { name: "—" };
    const key = c.name || "—";
    (cups[key] = cups[key] || { info: c, tracks: [] }).tracks.push(tid);
  }
  for (const [name, cup] of Object.entries(cups)) {
    const refOf = e => !e ? null : target === "wr" ? e.wr : target === "rival" ? (e.rival ? e.rival.timeMs : null) : e.staff;
    const met = (e, dTarget) => dTarget != null && (target === "wr"
      ? dTarget >= 0 && dTarget <= WR_GOAL_WINDOW_MS
      : target === "rival" ? e.rivalsAhead === 0 : dTarget < 0);
    const beaten = cup.tracks.filter(tid => {
      const e = idx[tid], ref = refOf(e);
      return e && e.best != null && ref != null && met(e, e.best - ref);
    }).length;
    h += `<section class="cupcard">
      <header>${cupImg(cup.info, "cupic big")}<b>${esc(locName(cup.info) || name)}</b>
        <span class="cnt">${beaten}/${cup.tracks.length}</span></header>`;
    for (const tid of cup.tracks) {
      const e = idx[tid], ref = refOf(e);
      const dTarget = e && e.best != null && ref != null ? e.best - ref : null;
      const targetMet = met(e, dTarget);
      const cls = targetMet ? "beat" : e && e.best != null ? "has" : "none";
      const rivalName = target === "rival" && e && e.rival ? ` <small class="dim">${esc(e.rival.name)}</small>` : "";
      const gap = (dTarget == null
        ? (ref != null ? fmtT(ref) : (target === "rival" ? `<span class="dim">${T("goalNoRivals")}</span>` : "—"))
        : fmtDs(dTarget)) + rivalName;
      const gapCls = dTarget == null ? "dim" : dTarget < 0 ? "cplus" : "cmin";
      const tip = `${T("staffGhost")}: ${e && e.staff != null ? fmtT(e.staff) : "—"}`
        + `${e && e.wr != null ? " · " + T("worldRecord") + ": " + fmtT(e.wr) : ""}`
        + `${e && e.rival ? " · " + T("goalRivals") + ": " + esc(e.rival.name) + " " + fmtT(e.rival.timeMs) : ""}`;
      h += `<div class="ctrack goal ${cls}"${e && e.bestRun ? ` data-key="${esc(runKey(e.bestRun))}" data-goruns="1"` : ""} title="${esc(tip)}" style="${gapRowStyle(dTarget)}">
        ${e && e.icon ? `<img src="${A(e.icon)}" alt="" loading="lazy">` : `<i></i>`}
        <span class="nm">${esc(e ? e.name : pretty(tid))}</span>
        <span class="tm">${e && e.best != null ? fmtT(e.best) + (e.fromSite ? ` <small class="dim" title="${esc(T("fromSite"))}">☁</small>` : "") : `<span class="dim">—</span>`}</span>
        <span class="goalgap ${gapCls}" style="${dTarget == null ? "" : gapStyle(dTarget) + ";border-radius:8px;padding:1px 7px"}">${gap}</span></div>`;
    }
    h += `</section>`;
  }
  return h + `</div>`;
}

/* =============== rivals (imported friend export) =============== */
let RIVAL = null;
/* restore AFTER the declaration: an assignment above it is a temporal-dead-zone
   ReferenceError that the try/catch would swallow, silently losing the rival */
try {
  const rv = localStorage.getItem("lt-rival");
  if (rv) RIVAL = JSON.parse(rv);
} catch (e) { RIVAL = null; }

function loadRival(file) {
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const j = JSON.parse(fr.result);
      RIVAL = (j.format || "").startsWith("livetrial.rivals") ? j : null;
      if (RIVAL) localStorage.setItem("lt-rival", fr.result);
    } catch (e) { RIVAL = null; }
    FORCE_RENDER = true; render();
  };
  fr.readAsText(file);
}
function rivalRow(tid, cc, cat) {
  if (!RIVAL) return null;
  return (RIVAL.best || []).find(b => b.track === tid && String(b.cc) === String(cc) && b.category === cat) || null;
}

/* =============== cups & tracks overview =============== */
/* Which of the courses you already have a time on, grouped by cup, with the
   ones whose LATEST run set a new record called out. It answers "what have I
   still not driven?" — which the runs list, being chronological, cannot. */
function cupIndex(cc = CUPCC) {
  const cups = {};                       // cup name -> {info, tracks:[tid]}
  for (const [tid, t] of Object.entries((META || {}).tracks || {})) {
    const c = t.cup || { name: "—" };
    const key = c.name || "—";
    (cups[key] = cups[key] || { info: c, tracks: [] }).tracks.push(tid);
  }
  const mine = {};                       // tid -> {best, cc, record, when, n}
  for (const r of countedRuns()) {
    if (r.aborted || r.archived) continue;
    const tid = trackId(r), p = ((r.results || {}).player || {});
    if (!tid || p.totalMs == null || String((r.context || {}).cc || "") !== String(cc)) continue;
    const e = mine[tid] = mine[tid] || { best: null, bestRun: null, cc: null, record: false, when: 0, n: 0 };
    e.n++;
    if (e.best == null || p.totalMs < e.best) {
      e.best = p.totalMs;
      e.bestRun = r;
      e.cc = (r.context || {}).cc || "150";
    }
    if ((r.capturedAt || 0) > e.when) {
      e.when = r.capturedAt || 0;
      e.record = (r.events || []).some(x => x.type === "banner_new_record");
    }
  }
  return { cups, mine };
}

  let h = `<div class="dhead"><h2>${T("cupsTitle")}</h2>

  for (const [name, c] of Object.entries(cups)) {
    const got = c.tracks.filter(t => mine[t]).length;
    h += `<section class="cupcard">
      <header>${cupImg(c.info, "cupic big")}<b>${esc(locName(c.info) || name)}</b>
        <span class="cnt">${got}/${c.tracks.length}</span></header>`;
    for (const tid of c.tracks) {
      const t = META.tracks[tid], m = mine[tid];
      const cls = m ? (m.record ? "has rec" : "has") : "none";
      h += `<div class="ctrack ${cls}"${m && m.bestRun ? ` data-key="${esc(runKey(m.bestRun))}" data-goruns="1"` : ""}>
        ${t.icon ? `<img src="${A(t.icon)}" alt="" loading="lazy">` : `<i></i>`}
        <span class="nm">${esc(locName(t))}</span>
        <span class="tm">${m ? fmtT(m.best) : `<span class="dim">${T("cupsNone")}</span>`}</span>
        ${m && m.record ? `<span class="recdot" title="${T("cupsRecord")}">★</span>` : ""}</div>`;
    }
    h += `</section>`;
  }
  return h + `</div>`;
}

let STORAGE = null;
const GBv = b => (b / (1024 ** 3)).toFixed(b > 1024 ** 3 * 10 ? 0 : 1) + " GB";
const hrs = s => s >= 3600 ? (s / 3600).toFixed(1) + " h" : Math.round(s / 60) + " min";
function storageBadge() {
  const w = (STORAGE && STORAGE.warnings) || [];
  if (w.some(x => x.level === "alert")) return " ⚠";
  if (w.some(x => x.level === "warn")) return " !";
  return "";
}
async function loadStorage() {
  try { STORAGE = await (await fetch("api/storage")).json(); }
  catch (e) { STORAGE = null; }
  FORCE_RENDER = true;
  render();
}
async function saveSetting(k, v) {
  try { await fetch("api/settings?" + k + "=" + encodeURIComponent(v)); } catch (e) {}
  await loadStorage();
}
async function runCleanup(dry) {
  try { await fetch("api/storage/cleanup" + (dry ? "?dry=1" : "")); } catch (e) {}
  await loadStorage();
}
async function togglePin(file) {
  try { await fetch("api/pin?file=" + encodeURIComponent(file)); } catch (e) {}
  await loadStorage();
}

/* =============== tracks view =============== */
function trackAgg() {
  const by = {};
  for (const r of countedRuns()) {
    if (r.aborted || r.archived) continue;
    const tid = trackId(r), p = ((r.results || {}).player || {});
    if (!tid || p.totalMs == null) continue;
    const cc = (r.context || {}).cc || "150", cat = catOf(r);
    const k = tid + "|" + cc + "|" + cat;
    const e = by[k] = by[k] || { tid, cc, cat, runs: [] };
    e.runs.push(r);
  }
  return Object.values(by).map(e => {
    e.runs.sort((a, b) => (a.capturedAt || 0) - (b.capturedAt || 0));
    const totals = e.runs.map(r => r.results.player.totalMs);
    e.best = Math.min(...totals);
    e.bestRun = e.runs.find(r => r.results.player.totalMs === e.best);
    e.totals = totals;
    const n = e.bestRun.lapCount;
    const allLaps = e.runs.map(r => r.results.player.lapTimesMs).filter(l => l && l.length === n && l.every(v => v != null));
    e.theo = allLaps.length ? Array.from({ length: n }, (_, i) => Math.min(...allLaps.map(l => l[i]))).reduce((a, b) => a + b, 0) : null;
    const rec = ((META.records || {})[e.tid] || {})[e.cc];
    e.wr = rec && rec.wr ? rec.wr.timeMs : null;
    return e;
  }).sort((a, b) => b.runs[b.runs.length - 1].capturedAt - a.runs[a.runs.length - 1].capturedAt);
}

function sparkline(vals, w = 78, h = 30) {
  if (vals.length < 2) return "";
  const mn = Math.min(...vals), mx = Math.max(...vals), rng = Math.max(1, mx - mn);
  const pt = (v, i) => [i / (vals.length - 1) * (w - 8) + 4, (1 - (mx - v) / rng) * (h - 10) + 5];
  const pts = vals.map((v, i) => pt(v, i).map(n => n.toFixed(1)).join(","));
  const [lx, ly] = pt(vals[vals.length - 1], vals.length - 1);
  // down = faster (lower total time)
  return `<svg width="${w}" height="${h}" aria-hidden="true"><polyline points="${pts.join(" ")}"
    fill="none" stroke="var(--player)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="3" fill="var(--player)"/></svg>`;
}

function tracksListHtml() {
  const agg = trackAgg();
  if (!agg.length) return `<div class="empty">${T("noRuns")}</div>`;
  return agg.map(e => {
    const t = trackOf(e.tid);
    const bkey = runKey(e.bestRun);
    const wrGap = e.wr != null ? e.best - e.wr : null;
    return `<div class="trackrow" data-key="${esc(bkey)}" data-goruns="1">
      <div class="toprow">

    </div>
    <div class="chartwrap" id="tlwrap">
      <svg id="timeline" width="100%" height="220" role="img" aria-label="${T("timeline")}"></svg>
