function lapTablePanel(r, coinIcon, mushIcon) {
  const p = (r.results || {}).player, g = (r.results || {}).ghost;
  if (!p || !p.lapTimesMs || !p.lapTimesMs.some(v => v != null)) return "";
  const n = p.lapTimesMs.length;
  const { gained, lost, endCnt, shrooms } = coinsPerLap(r);
  const bestP = Math.min(...p.lapTimesMs.filter(v => v != null));
  const bestG = g && g.lapTimesMs ? Math.min(...g.lapTimesMs.filter(v => v != null)) : null;
  const mushUrl = A((META.items || {}).mushroom);
  // three fixed mushroom slots per lap: column spacing never shifts,
  // whichever lap the mushrooms were used in
  const shroomCells = k => [0, 1, 2].map(s =>
    `<td class="mslot">${s < k && mushUrl ? `<img class="shroomdot" src="${mushUrl}" alt="mushroom">` : ""}</td>`).join("");
  // best time: star BEFORE the time so the digits stay aligned
  const timeCell = (v, best) =>
    `<td class="${v === best ? "best" : ""}">${v === best ? "★ " : ""}${fmtT(v)}</td>`;
  let cum = 0, rows = "";
  for (let i = 0; i < n; i++) {
    const pv = p.lapTimesMs[i], gv = g && g.lapTimesMs ? g.lapTimesMs[i] : null;
    const d = pv != null && gv != null ? pv - gv : null;
    if (d != null) cum += d;
    rows += `<tr>
      <td>${T("lap")} ${i + 1}</td>${shroomCells(shrooms[i])}
      ${timeCell(pv, bestP)}
      ${g ? `${timeCell(gv, bestG)}
      <td style="color:${d == null ? "inherit" : d <= 0 ? "var(--good-text)" : "var(--bad-text)"}">${d != null ? fmtD(d) : "—"}</td>
      <td style="color:${cum <= 0 ? "var(--good-text)" : "var(--bad-text)"}">${d != null ? fmtD(cum) : "—"}</td>` : ""}
      <td class="cplus">${gained[i] ? "+" + gained[i] : ""}</td>
      <td class="cmin">${lost[i] ? "−" + lost[i] : ""}</td>
      <td class="cend">${endCnt[i] != null ? endCnt[i] : ""}</td>
    </tr>`;
  }
  const dTot = p.totalMs != null && g && g.totalMs != null ? p.totalMs - g.totalMs : null;
  const totGain = gained.reduce((a, b) => a + b, 0), totLost = lost.reduce((a, b) => a + b, 0);
  rows += `<tr class="total"><td></td><td colspan="3"></td><td>${fmtT(p.totalMs)}</td>
    ${g ? `<td>${fmtT(g.totalMs)}</td>
    <td style="color:${dTot <= 0 ? "var(--good-text)" : "var(--bad-text)"}">${dTot != null ? fmtD(dTot) : ""}</td><td></td>` : ""}
    <td class="cplus">${totGain ? "+" + totGain : ""}</td>
    <td class="cmin">${totLost ? "−" + totLost : ""}</td>
    <td class="cend">${endCnt[n - 1] != null ? endCnt[n - 1] : ""}</td></tr>`;
  return `<div class="panel"><h2>${T("lapTimes")}</h2><div class="lapswrap">
    <table class="laps"><thead><tr><th></th>
      <th colspan="3" class="mhead">${mushIcon ? `<img class="itemic" src="${mushIcon}" alt="${T("mushrooms")}">` : ""}</th>
      <th>${r.ghostReplay ? esc(r.ghostReplay.name || T("ghost")) : T("player")}</th>
      ${g ? `<th>${T("ghost")}</th><th>${T("delta")}</th><th>${T("cum")}</th>` : ""}
      <th class="cplus">+</th><th class="cmin">−</th>
      <th class="cend">${coinIcon ? `<img class="itemic" src="${coinIcon}" alt="${T("coins")}">` : T("coinsShort")}</th>
    </tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

function recordsPanel(r) {
  const tid = trackId(r), cc = (r.context || {}).cc;
  const p = (r.results || {}).player;
  if (!tid || !cc || !p || p.totalMs == null) return "";
  const rec = ((META.records || {})[tid] || {})[cc];
  if (!rec) return "";
  const agg = trackAgg().find(e => e.tid === tid && e.cc === cc);
  const row = (icon, label, t, who) => t == null ? "" :
    `<div class="recrow"><span class="ric">${icon}</span><span class="lbl">${label}</span><span class="t">${fmtT(t)}</span>
     <span class="gap ${p.totalMs - t <= 0 ? "ahead" : ""}" style="${gapStyle(p.totalMs - t)}">${fmtDs(p.totalMs - t)}</span>
     <span class="who2">${esc(who || "")}</span></div>`;
  let wrLaps = "";
  if (rec.wr && rec.wr.lapTimesMs && p.lapTimesMs && rec.wr.lapTimesMs.length === p.lapTimesMs.length && EXPERT) {
    wrLaps = `<div style="font-size:12px;color:var(--ink-muted);margin-top:8px">WR splits: ` +
      rec.wr.lapTimesMs.map((v, i) => `L${i + 1} ${fmtT(v)} (${p.lapTimesMs[i] != null ? fmtDs(p.lapTimesMs[i] - v) : "—"})`).join(" · ") + `</div>`;
  }
  return `<div class="panel"><h2>${T("records")}</h2>
    ${row("🌍", T("worldRecord"), rec.wr && rec.wr.timeMs, rec.wr && rec.wr.player)}
    ${row(`<img src="static/nintendo.png" alt="Nintendo" style="height:16px;border-radius:3px;vertical-align:-3px">`,
          T("staffGhost"), rec.staff && rec.staff.timeMs, rec.staff && rec.staff.player)}
    ${(() => {
        const ref = refFor(tid, cc);
        if (!ref) return agg && agg.best !== p.totalMs ? row("⭐", T("personalBest"), agg.best, "") : "";
        let h = "";
        if (ref.pb != null) h += row("⭐", T("sitePb"), ref.pb, ref.rank != null ? `#${ref.rank}` : "");
        const faster = (ref.others || []).filter(o => o.timeMs < p.totalMs);
        const slower = (ref.others || []).filter(o => o.timeMs >= p.totalMs);
        if (faster.length) { const o = faster[faster.length - 1]; h += row("🤝", T("nextRival"), o.timeMs, o.name); }
        else if (ref.others && ref.others.length) h += `<div class="recrow"><span class="ric">🤝</span><span class="lbl">${T("nextRival")}</span><span class="t dim">${T("noRivalAhead")}</span></div>`;
        if (slower.length) { const o = slower[0]; h += row("👀", T("behindYou"), o.timeMs, o.name); }
        if (agg && agg.best !== p.totalMs && agg.best !== ref.pb) h += row("💻", T("localBest"), agg.best, "");
        return h;
      })()}
    ${rec.wr && rec.wr.loadout ? `<div class="wrcombo"><span class="dim">${T("wrCombo")}:</span>
      ${["characterId", "bodyId", "tireId", "gliderId"].map(k => {
          const pp = rec.wr.loadout[k] && part(rec.wr.loadout[k]);
          return pp && pp.icon ? `<img src="${A(pp.icon)}" title="${esc(pp.name)}" alt="${esc(pp.name)}">` : "";
        }).join("")}
      ${rec.wr.videoUrl ? `<a href="${esc(rec.wr.videoUrl)}" target="_blank" rel="noopener">▶ ${T("wrVideo")}</a>` : ""}
      </div>` : ""}
    ${RIVAL && rivalRow(tid, cc, catOf(r)) ? (() => {
        const rv = rivalRow(tid, cc, catOf(r));
        return row("🤝", T("rival"), rv.timeMs, "");
      })() : ""}
    ${wrLaps}</div>`;
}

function loadoutStats(o) {
  const stats = ["character", "kart", "wheel", "glider"]
    .map(k => { const p = part(o[k] && o[k].id); return p && p.stats; });
  if (stats.some(s => !s)) return null;
  return [[T("speed"), "speedLand"], [T("accel"), "acceleration"], [T("weight"), "weight"],
          [T("handling"), "handlingLand"], [T("grip"), "traction"], [T("miniturbo"), "miniTurbo"]]
    .map(([lbl, key]) => {
      // per-part contributions (character/body/tire/glider) for stacked bars
      const segs = stats.map(s => s[key] || 0);
      let v = segs.reduce((a, b) => a + b, 0);
      if (v > 5.75) { const f = 5.75 / v; for (let i = 0; i < segs.length; i++) segs[i] *= f; v = 5.75; }
      return { lbl, v, segs };
    });
}

function identityPanel(r) {
  const ids = r.identity || {};
  if (!ids.player && !ids.ghost) return "";
  // APK setup tiles: kind label above, icon in an accent-bordered box,
  // name below (amber + " ?" when unsure — same marker as the app)
  const KIND_LBL = { character: "Character", kart: "Body", wheel: "Tire", glider: "Glider" };
  const tiles = o => `<div class="parttiles">` + ["character", "kart", "wheel", "glider"].map(k => {
    const v = o[k];
    if (!v) return `<div class="ptile ${k}"></div>`;
    const pp = part(v.id);
    // a name-strip override is authoritative — never mark it unsure
    const unsure = !v.name_strip_override && (v.score < 0.75 || v.margin < 0.02);
    const ic = pp && pp.icon ? `<img src="${A(pp.icon)}" alt="" loading="lazy">` : "";
    const nm = partName(v.id);
    return `<div class="ptile ${k}"><span class="pk">${KIND_LBL[k]}</span>
      <span class="pbox">${ic}</span>
      <span class="pn ${unsure ? "unsure2" : ""}" title="${esc(nm)}${unsure ? " — " + T("unsure") : ""}">${esc(nm)}${unsure ? " ?" : ""}</span>
      ${EXPERT ? `<span class="ps">${v.score.toFixed(2)}</span>` : ""}</div>`;
  }).join("") + `</div>`;
  const card = (who, o, color) => {
    if (!o) return "";
    const fl = o.flag && flagOf(o.flag.id);
    const ev = o.evidenceFile ? `runs/${o.evidenceFile}` : null;
    const evid = "ev_" + color;
    // player: the name strip IS the character name — show the resolved, clean
    // name; the raw OCR read only matters to experts. Ghost: the strip is the
    // ghost owner's username, that IS the interesting name.
    const charName = o.character && partName(o.character.id);
    const shownName = color === "player" ? null : o.name;
    const rawRead = EXPERT && o.name && o.name !== shownName
      ? ` <span style="color:var(--ink-muted);font-weight:500;font-size:12px" title="${T("nameRead")}">“${esc(o.name)}”</span>` : "";
    return `<div class="loadout ${color === "player" ? "p" : "g"}">
      <div class="who">${color === "ghost"
        ? `<span class="badge"><img class="bic" src="${BOO}" alt=""> ${T("ghost").toLowerCase()}</span>`
        : `<span class="tag">${who}</span>`}${shownName ? ` <span style="font-weight:650">${esc(shownName)}</span>` : ""}${rawRead}
        ${fl ? `<img class="flagic" src="${A(fl.icon)}" title="${esc(fl.name)}" alt="${esc(fl.name)}">` : ""}</div>
      ${tiles(o)}
      ${ev ? `<div><span class="evlink" onclick="const i=document.getElementById('${evid}');if(!i.src)i.src=i.dataset.src;i.style.display=i.style.display==='none'?'':'none'">${T("evidence")}</span>
        <img id="${evid}" class="evimg" data-src="${ev}" style="display:none" alt="card evidence"></div>` : ""}
    </div>`;
  };
  const sp = loadoutStats(ids.player || {}), sg = ids.ghost ? loadoutStats(ids.ghost) : null;
  const partsOf = o => ["character", "kart", "wheel", "glider"].map(k => (o[k] || {}).id).join("|");
  const identical = ids.player && ids.ghost && partsOf(ids.player) === partsOf(ids.ghost);
  let cmp = "";
  if (sp) {
    const legend = `<div class="legend2">
      <span><span class="swatch" style="background:var(--acc-character)"></span> Character</span>
      <span><span class="swatch" style="background:var(--acc-kart)"></span> Body</span>
      <span><span class="swatch" style="background:var(--acc-wheel)"></span> Tire</span>
      <span><span class="swatch" style="background:var(--acc-glider)"></span> Glider</span>
      <span style="margin-left:auto;color:var(--ink-muted)">${sg ? `${T("player")} ↑ · ${T("ghost")} ↓ · ` : ""}| ${T("statsLegendCap")}</span></div>`;
    const segRow = (segs, cls) => {
      let acc = 0;
      return `<span class="brow ${cls}">` + segs.map((w, k) => {
        const left = acc / 6 * 100; acc += w;
        return `<span class="seg k${k}" style="left:${left.toFixed(2)}%;width:${(w / 6 * 100).toFixed(2)}%"></span>`;
      }).join("") + `</span>`;
    };
    const ticks = [1, 2, 3, 4, 5].map(v =>
      `<span class="tick2" style="left:${(v / 6 * 100).toFixed(2)}%"></span>`).join("");
    cmp = `<div class="cmpstats">` + legend + sp.map((s, i) => {
      const g = sg ? sg[i] : null;
      const vTxt = g != null && g.v !== s.v ? `${s.v.toFixed(2)} · ${g.v.toFixed(2)}` : s.v.toFixed(2);
      return `<div class="sb"><span>${s.lbl}</span>
        <span class="bars ${g == null ? "solo" : ""}">
          ${ticks}
          ${segRow(s.segs, "p")}
          ${g != null ? segRow(g.segs, "g") : ""}
          <span class="cap" style="left:${(5.75 / 6 * 100).toFixed(1)}%"></span>
        </span><span class="v">${vTxt}</span></div>`;
    }).join("") + (identical ? `<div class="samenote">⇄ ${T("identical")}</div>` : "") + `</div>`;
  }
  return `<div class="panel"><h2>${T("loadouts")}</h2><div class="loadouts">
    ${card(T("player"), ids.player, "player")}${card(T("ghost"), ids.ghost, "ghost")}

function eventsPanel(r) {
  const evd = STR[LANG].ev;
  const label = e => {
    if (e.type === "coin") return `${evd.coin} ${e.from} → ${e.to}`;
    if (e.type === "lap") return `${evd.lap} ${e.lap}`;
    if (e.type === "mushrooms") return `${evd.mushrooms} (${e.to} over)`;
    // Both of these now carry the digits the HUD showed (hudtimes.py reads
    // them off the frozen clock). e.text is absent only on runs recorded
    // before that landed, so the side/lap wording still has to stand alone.
    if (e.type === "lapTime")
      return `${evd.lap} ${e.lap} — ${evd.lapTime} ${e.text || ""}`.trim();
    if (e.type === "resume")
      return `${evd.resume} (${Math.round((e.heldMs || 0) / 1000)}s)`;
    if (e.type === "delta")
      return `${evd.lap} ${e.lap} — ${e.text ? e.text + " " : ""}`
           + `${e.side === "ahead" ? evd.deltaAhead : evd.deltaBehind}`;
    return evd[e.type] || e.type;
  };
  const liveTime = i => {
    if (i.race) return esc(String(i.race).replace(/\.\d+$/, ""));
    const t = Number(i.t), armed = Number(r.armedAtMs);
    if (Number.isFinite(t) && Number.isFinite(armed)) {
      const d = t - armed;
      return `${d < 0 ? "-" : "+"}${fmtT(Math.abs(d)).replace(/\.\d+$/, "")}`;
    }
    return esc(i.wall || "");
  };
  const liveRows = (r.liveLog || []).map(i => {
    const row = tickerRow(i);
    return `<tr><td>${liveTime(i)}</td><td><span class="em">${row.icon}</span> ${row.text}</td></tr>`;
  }).join("");
  return `<div class="panel"><details class="evd"><summary>${T("eventLog")}</summary>
    <table class="events"><thead><tr><th>${T("time")}</th><th>${T("event")}</th></tr></thead><tbody>
    ${(r.events || []).map(e => `<tr><td>+${fmtT(raceT(e))}</td><td>${esc(label(e))}</td></tr>`).join("")}
    </tbody></table></details>
    ${liveRows ? `<details class="evd"><summary>${T("liveLog")}</summary>
      <table class="events"><thead><tr><th>${T("time")}</th><th>${T("event")}</th></tr></thead><tbody>
      ${liveRows}</tbody></table></details>` : ""}</div>`;
}

/* =============== timeline chart =============== */
// Lap boundaries (the moment each new lap STARTS), preferring the authoritative
// result-screen splits over live lap events. Live lap-event detection reads the
// small "x/3" HUD counter, which scores low on some captures and can be missed
// entirely — then every coin/mushroom falls into lap 1 and the chart shows no
// laps. The result-screen lap times never lie, so build boundaries from their
// cumulative sum; fall back to detected lap events only when splits are absent.
function lapBoundaries(r) {
  const lt = ((r.results || {}).player || {}).lapTimesMs;
  if (lt && lt.length > 1 && lt.every(v => v != null)) {
    const out = []; let cum = 0;
    for (let i = 0; i < lt.length - 1; i++) { cum += lt[i]; out.push({ t: cum, lap: i + 2 }); }
    return out;
  }
  return (r.events || []).filter(e => e.type === "lap").map(e => ({ t: raceT(e), lap: e.lap }));
}

function seriesFrom(r) {
  const end = ((r.results || {}).player || {}).totalMs ||
              Math.max(1, ...(r.events || []).map(raceT));
  const coins = [{ t: 0, v: 0 }], mush = [{ t: 0, v: 3 }];
  for (const e of r.events || []) {
    if (e.type === "coin") coins.push({ t: raceT(e), v: e.to });
    if (e.type === "mushrooms") mush.push({ t: raceT(e), v: e.to });
    if (e.type === "mushroom_use_1to0_ring_exit") mush.push({ t: raceT(e), v: 0 });
  }
  return { end, coins, mush, lapsAt: lapBoundaries(r) };
}

function wireTimeline(r) {
  const svg = document.getElementById("timeline");
  if (!svg) return;
  const { end, coins, mush, lapsAt } = seriesFrom(r);
  const W = svg.clientWidth || 800, H = 220, L = 34, R = 14, Tm = 16, B = 26;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const x = t => L + (t / end) * (W - L - R);
  const y = v => Tm + (1 - v / 10) * (H - Tm - B);
  const step = pts => {
    let d = `M${x(pts[0].t)},${y(pts[0].v)}`;
    for (let i = 1; i < pts.length; i++) d += `H${x(pts[i].t)}V${y(pts[i].v)}`;
    return d + `H${x(end)}`;
  };
  let s = "";
  // alternating lap bands instead of dashed cut lines: calmer, more readable
  const bounds = [0, ...lapsAt.map(l => l.t), end];
  for (let i = 0; i + 1 < bounds.length; i++) {
    if (i % 2 === 1)
      s += `<rect x="${x(bounds[i])}" y="${Tm}" width="${x(bounds[i + 1]) - x(bounds[i])}" height="${H - Tm - B}"
             fill="var(--ink-1)" opacity="0.05"/>`;
    const mid = (x(bounds[i]) + x(bounds[i + 1])) / 2;
    if (x(bounds[i + 1]) - x(bounds[i]) > 26)
      s += `<text x="${mid}" y="${Tm - 4}" text-anchor="middle" font-weight="600">L${i + 1}</text>`;
  }
  for (let v = 0; v <= 10; v += 2)
    s += `<line x1="${L}" y1="${y(v)}" x2="${W - R}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/>
          <text class="tick" x="${L - 6}" y="${y(v) + 3.5}" text-anchor="end">${v}</text>`;
  s += `<line x1="${L}" y1="${y(0)}" x2="${W - R}" y2="${y(0)}" stroke="var(--baseline)" stroke-width="1"/>`;
  const nt = Math.max(1, Math.min(6, Math.ceil(end / 15000)));
  for (let i = 0; i <= nt; i++) {
    const t = (end / nt) * i;
    const anchor = i === 0 ? "start" : i === nt ? "end" : "middle";
    s += `<text class="tick" x="${x(t)}" y="${H - 8}" text-anchor="${anchor}">${fmtT(Math.round(t))}</text>`;
  }
  s += `<path d="${step(mush)}" fill="none" stroke="var(--ghost)" stroke-width="2.5" stroke-linejoin="round"/>`;
  s += `<path d="${step(coins)}" fill="none" stroke="var(--player)" stroke-width="2.5" stroke-linejoin="round"/>`;
  for (const c of coins.slice(1))
    s += `<circle cx="${x(c.t)}" cy="${y(c.v)}" r="3.5" fill="var(--player)" stroke="var(--surface-1)" stroke-width="1.5"/>`;
  for (const e of (r.events || []).filter(e => e.type.startsWith("mushroom_use")))
    s += `<circle cx="${x(raceT(e))}" cy="${y(at(mush, raceT(e)))}" r="4.5" fill="var(--ghost)" stroke="var(--surface-1)" stroke-width="2"/>`;
  s += `<line id="cross" x1="0" y1="${Tm}" x2="0" y2="${H - B}" stroke="var(--ink-muted)" stroke-width="1" style="display:none"/>`;
  svg.innerHTML = s;

  const tip = document.getElementById("tltip");
  const cross = svg.querySelector("#cross");
  svg.onmousemove = ev => {
    const rect = svg.getBoundingClientRect();
    const px = (ev.clientX - rect.left) * (W / rect.width);
    if (px < L || px > W - R) { tip.style.display = "none"; cross.style.display = "none"; return; }
    const t = (px - L) / (W - L - R) * end;
    let lap = 1; for (const lb of lapsAt) if (lb.t <= t) lap = lb.lap;
    cross.setAttribute("x1", px); cross.setAttribute("x2", px); cross.style.display = "";
    tip.style.display = "block";
    tip.innerHTML = `<b>+${fmtT(Math.round(t))}</b> · ${T("lap").toLowerCase()} ${lap}<br>` +
      `<span class="swatch" style="background:var(--player)"></span> ${T("coins").toLowerCase()} <b>${at(coins, t)}</b> &nbsp;` +

// Rich per-row renderer for the live event ticker. Each server msg is a plain
// string (built by watch.py::_describe); we parse it and return {cls, icon, text}
// where cls = accent category, icon = the fixed-slot icon (asset <img> or emoji),
// text = the prettified message with ONE bold/coloured key value. Output is a pure
// function of (msg, META, live ctx) so identical state yields identical HTML and
// the setHTML dirty-check keeps the feed from thrashing on every poll.
// The gap against the ghost, coloured by side. Solo runs have no delta at all
// — that is the game showing none, not a failed read, so it renders as nothing.
const gapHtml = d => {
  if (d.deltaMs == null && !d.delta) return "";
  const ms = Math.abs(d.deltaMs != null ? d.deltaMs : 0);
  const L = STR[LANG].tk;
  // past a minute the unit is the colon, not "s" — "1:01 s" reads as nonsense
  const s = ms >= 60000
    ? `${Math.floor(ms / 60000)}:${String(Math.floor(ms % 60000 / 1000)).padStart(2, "0")}`
    : (ms / 1000).toFixed(3).replace(".", STR[LANG].dec || ".") + L.sec;
  return d.side === "ahead"
    ? `<b class="win">${s} ${L.ahead}</b>`
    : `<b class="bad">${s} ${L.behind}</b>`;
};

};
const tickerRow = i => {

  const ctxTrack = ((DATA.liveState || {}).ctx || {}).track;
  const img = (url, alt) => `<img src="${url}" alt="${alt || ""}">`;
  let x;
  // STRUCTURED first. Everything below this block reverse-engineers the
  // server's English prose with regexes, and that cost us the numbers we had
  // already decoded: /^Lap (\d+)/ matched "Lap 2" (now on lap 2), "Lap 1 —
  // 0:28.238" and "Lap 1 — -0:00.722 AHEAD", rendered all three as "Lap N",
  // and so showed three identical rows in an order that read as 3, 2, 2.
  // Items carrying `kind` skip the guessing entirely; the prose path stays
  // for older payloads and for the events that need no structure.
  if (i.kind) {

    if (i.kind === "lapReport")
      return { cls: "tk-lap", icon: "🏁",

    if (i.kind === "lapDelta")

  if (/^Countdown/.test(m))

  if (x = m.match(/^Lap\s+(\d+)/))

  if (x = m.match(/^Coins\s+(\d+)\s*→\s*(\d+)/)) {

  if (/Lost vs ghost/.test(m))

  if (/NEW RECORD/.test(m))

    const reason = (STR[LANG].abortedReason || {})[x[2]] || x[2];

function setHTML(el, html) {

    lt.style.display = "none";
  }
  document.getElementById("lv-clock").textContent = s.clock || "";
  document.getElementById("lv-meta").textContent =
    `${s.runs ?? 0} ${T("runs").toLowerCase()} · ${Math.floor((s.elapsedMs || 0) / 60000)}m ${T("session")}`;
  const c = s.ctx || {};
  const tk = c.track && trackOf(c.track);
  setHTML(document.getElementById("lv-chips"),
    [tk ? `${tk.cup && tk.cup.icon ? `<img class="bic" src="${A(tk.cup.icon)}" alt="">` : ""}${esc(locName(tk))}`
        : (c.track && esc(String(c.track).replace(/^track\./, ""))),
     null, c.mode === "ghost" ? `<img class="bic" src="${BOO}" alt=""> ` + T("ghost").toLowerCase() : c.mode]
      .filter(Boolean).map(t => `<span class="badge">${t}</span>`).join("")
    + (c.cc ? ccChip(c.cc) : "")
    || `<span class="badge">${T("noContext")}</span>`);
  setHTML(document.getElementById("lv-ticker"), (s.ticker || [])
    .map(i => { const r = tickerRow(i);
      // the race clock when the server stamped one, else session elapsed —
      // "12:40" for a race 28 seconds old was nobody's idea of a timestamp
      // race clock inside a race, time of day outside one. Session-elapsed is
      // the last resort (older payloads) and is the confusing one: it looks
      // like a race time and is not.
      const tt = i.race ? esc(i.race.replace(/\.\d+$/, ""))
               : i.wall ? esc(i.wall)
               : fmtT(i.t).replace(/\.\d+$/, "");
      return `<div class="tk ${r.cls}"><span class="tt">${tt}</span><span class="em">${r.icon}</span><span class="msg">${r.text}</span></div>`; })
    .join("") || `<div class="tickempty">
      <div class="step"><span class="n">1</span>🗺️ ${T("stepPick")}</div>
      <div class="step"><span class="n">2</span>🚦 ${T("stepStart")}</div>
      <div class="step"><span class="n">3</span>📝 ${T("stepWatch")}</div></div>`);
  if (APP_LIVE) updateAppLiveSummary(s);
  // preview refresh is handled by the standalone pollPreview() timer below.
}

// Live preview via fast JPEG polling (NOT an MJPEG stream). The stream leaked
// server threads on Windows and, worse, when you switched tabs the <img> abort
// fired onerror -> it fell back to a 1.5 s poll (~0.7 fps, the "1 frame per
// second" lag that persisted after returning to the tab). Polling a small JPEG
// at ~12 fps is robust: each request is short-lived (no lingering connection,
// no thread pile-up), it survives tab-switches, and double-buffering (load into
// a detached Image, swap on load) keeps it flicker-free. Only one request is in
// flight at a time and none fire while the tab is hidden.
let _prevBusy = false, _shownAt = [], _shownFps = null;
const previewWanted = () => document.documentElement.dataset.view !== "history" && window.innerWidth > 0;
function pollPreview() {
  if (document.hidden || !DATA.live || !previewWanted()) return;
  const img = document.getElementById("lv-prev");
  if (!img || _prevBusy) return;
  _prevBusy = true;
  const next = new Image();
  next.onload = () => {
    img.src = next.src; _prevBusy = false;
    const now = performance.now(); _shownAt.push(now);
    while (_shownAt.length && now - _shownAt[0] > 1000) _shownAt.shift();
    _shownFps = _shownAt.length;
    const chip = document.getElementById("lv-fps");
    if (chip) { chip.textContent = `${T("picture")} ${_shownFps} fps`; chip.className = "conf " + (_shownFps >= 20 ? "cok" : "cwarn"); }
  };
  next.onerror = () => { _prevBusy = false; };
  next.src = "api/preview.jpg?t=" + Date.now() + (_shownFps == null ? "" : "&shown=" + _shownFps);
}
// ~30 fps while visible, driven by the display's frame callback rather than a timer: Edge clamps
// the timers of an embedded page it considers not visible to once a second, and did so in the
// owner's app window (measured 2026-09-28: 29 frames produced, 1 requested per second, until F5).
// requestAnimationFrame runs at the display rate whenever the frame is actually painted.
let _lastPreviewPoll = 0, _lastLivePoll = 0;
function previewLoop(now) {
  if (now - _lastPreviewPoll >= 30) { _lastPreviewPoll = now; pollPreview(); }
  if (now - _lastLivePoll >= 220) { _lastLivePoll = now; pollLive(); }
  requestAnimationFrame(previewLoop);
}
requestAnimationFrame(previewLoop);
document.addEventListener("visibilitychange", () => { if (!document.hidden) pollPreview(); });
if (EMBEDDED && APP_LIVE) {
  let lastHeight = -1;
  const postHeight = () => {
    const height = Math.ceil(document.getElementById("livewrap").getBoundingClientRect().height);
    if (height !== lastHeight) { lastHeight = height; parent.postMessage({ livetrialHeight: height }, "*"); }
  };
  new ResizeObserver(postHeight).observe(document.getElementById("livewrap"));
  setInterval(postHeight, 1000);
}

// Fast live-text poller: /api/runs is 26 KB and stays on the 1.5s load() path
// (run cards + lap table + chart), but the live ticker/phase/chips/mushrooms-left
// live inside that payload too and lagged the near-real-time preview by up to
// 1.5s. This hits the tiny /api/live companion (~a couple KB) ~4-5x/s and updates
// ONLY the live panel in place via updateLive() — no render() (that's the heavy
// history rebuild). setHTML's dirty-check means unchanged content is a no-op, so
// the ticker never scroll-resets when nothing new arrived. Idles cheaply when not
// live or when the tab is hidden (a flag check, no network); live goes true/false
// via the 1.5s load() cadence.
let _liveBusy = false;
async function pollLive() {
  if (document.hidden || !DATA.live || _liveBusy || !previewWanted()) return;
  _liveBusy = true;
  try {
    const j = await (await fetch("api/live", { cache: "no-store" })).json();
    DATA.live = j.live; DATA.liveState = j.liveState; DATA.record = j.record;
    updateLive();  // live panel only, in place; NO render()
  } catch (e) { /* transient; next tick retries */ }
  finally { _liveBusy = false; }
}
// pollLive (~4-5 fps, tracks the preview) runs from previewLoop above for the same reason.

window.addEventListener("resize", () => { const r = selectedRun(); if (r) wireTimeline(r); });
load();
</script>
</body>
</html>
