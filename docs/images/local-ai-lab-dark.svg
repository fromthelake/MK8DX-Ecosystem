<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 344" width="640" height="344" role="img" aria-labelledby="t d">
<title id="t">FromTheLake Local AI Lab funding roadmap</title>
<desc id="d">First milestone 5,000 euro, complete setup approximately 23,000 euro, which includes the first milestone. Five capability stages. Funding progress is awaiting reconciliation; no progress is shown.</desc>
<defs><pattern id="h" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#21262d"/><line x1="0" y1="0" x2="0" y2="10" stroke="#3d444d" stroke-width="4"/></pattern></defs>
<rect x="1" y="1" width="638" height="342" rx="14" fill="#161b22" stroke="#3d444d" stroke-width="2"/>
<text x="40" y="50" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="24" font-weight="600" fill="#e6edf3">Local AI Lab funding roadmap</text>
<text x="40" y="78" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" fill="#9198a1">Planning targets, cumulative. Not supplier quotations.</text>
<text x="161.7" y="118" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#4493f8" text-anchor="middle">€5,000</text>
<text x="600" y="118" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#e6edf3" text-anchor="end">≈ €23,000</text>
<rect x="40" y="130" width="560" height="26" rx="13" fill="url(#h)" stroke="#3d444d" stroke-width="2"/>
<line x1="161.7" y1="124" x2="161.7" y2="162" stroke="#4493f8" stroke-width="4" stroke-linecap="round"/>
<text x="161.7" y="184" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#9198a1" text-anchor="middle">first milestone</text>
<text x="600" y="184" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#9198a1" text-anchor="end">complete setup</text>
<rect x="40.0" y="206" width="104.0" height="58" rx="10" fill="#0d1117" stroke="#3d444d" stroke-width="2"/>
<text x="92.0" y="230" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#9198a1" text-anchor="middle">Stage 1</text>
<text x="92.0" y="252" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#e6edf3" text-anchor="middle">Foundation</text>
<rect x="154.0" y="206" width="104.0" height="58" rx="10" fill="#0d1117" stroke="#3d444d" stroke-width="2"/>
<text x="206.0" y="230" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#9198a1" text-anchor="middle">Stage 2</text>
<text x="206.0" y="252" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#e6edf3" text-anchor="middle">32 GB GPU</text>
<rect x="268.0" y="206" width="104.0" height="58" rx="10" fill="#0d1117" stroke="#3d444d" stroke-width="2" stroke-dasharray="6 5"/>
<text x="320.0" y="230" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#9198a1" text-anchor="middle">Stage 3</text>
<text x="320.0" y="252" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#e6edf3" text-anchor="middle">48 GB GPU</text>
<rect x="382.0" y="206" width="104.0" height="58" rx="10" fill="#0d1117" stroke="#3d444d" stroke-width="2"/>
<text x="434.0" y="230" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#9198a1" text-anchor="middle">Stage 4</text>
<text x="434.0" y="252" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#e6edf3" text-anchor="middle">96 GB GPU</text>
<rect x="496.0" y="206" width="104.0" height="58" rx="10" fill="#0d1117" stroke="#3d444d" stroke-width="2"/>
<text x="548.0" y="230" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#9198a1" text-anchor="middle">Stage 5</text>
<text x="548.0" y="252" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#e6edf3" text-anchor="middle">Complete</text>
<text x="40" y="300" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" fill="#e6edf3">Progress awaiting reconciliation. Stages are capabilities,</text>
<text x="40" y="320" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" fill="#e6edf3">not fixed purchases; stage 3 may be skipped.</text>
</svg>
