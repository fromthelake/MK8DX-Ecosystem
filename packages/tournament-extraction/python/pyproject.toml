[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mk8dx-tournament-extraction"
version = "0.1.0"
description = "Shared confirmed-race output core for MK8DX tournament products"
requires-python = ">=3.12,<3.13"

[project.optional-dependencies]
vision = [
  # Install the hardware-selected torch wheels before this extra; see setup_torch.
  "easyocr==1.7.2",
  "jellyfish==1.1.3",
  "numpy==2.2.1",
  "opencv-python==4.10.0.84",
  "openpyxl==3.1.5",
  "pandas==2.2.3",
  "pillow==11.0.0",
  "psutil==7.2.1",
  "textdistance==4.6.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mk8dx_tournament_extraction = ["runtime-assets-v1.json", "track-names-v1.json", "config/app_config.example.json"]
