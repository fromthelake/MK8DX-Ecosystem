name: Translation correction
description: A text in your language is wrong, unclear or missing
labels: [translation]
body:
  - type: markdown
    attributes:
      value: |
        Only English and Dutch are reviewed by people; the other languages are machine-translated.
        Your corrections are one of the most valuable contributions there is. Thank you!
  - type: dropdown
    id: language
    attributes:
      label: Language
      options:
        - Nederlands
        - Deutsch
        - Español
        - Français
        - Italiano
        - Português
        - Русский
        - 日本語
        - 한국어
        - 简体中文
        - 繁體中文
        - English
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where is the text?
      description: A page or screen of the website, app or tool, or a README file.
      placeholder: "README_DE.md, section Time Trials"
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current text
    validations:
      required: true
  - type: textarea
    id: better
    attributes:
      label: Better text
      description: Your suggestion, and why if it is not obvious (for example the official in-game term).
    validations:
      required: true
