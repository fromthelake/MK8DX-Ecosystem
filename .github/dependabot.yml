# Routine version updates arrive together on Monday morning: npm and pip weekly, the slower ecosystems
# (Gradle, Docker, Docker Compose, GitHub Actions) monthly. A 3-day cooldown skips releases that are replaced within days.
# Security updates are not affected by the schedule or the cooldown: they are opened as soon as an advisory
# appears ("Dependabot security updates" is enabled in the repository settings).
# Exact pins stay exact: review each pull request like any other change (docs/TESTING.md).
# Group routine version updates per ecosystem; review majors separately.
version: 2
updates:
  - package-ecosystem: npm
    directories: [/backend/api, /apps/timetrials-web, /apps/timetrials-scanner-web]
    schedule: {interval: weekly, day: monday, time: "06:00", timezone: Europe/Amsterdam}
    cooldown: {default-days: 3}
    open-pull-requests-limit: 5
    groups:
      minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: gradle
    directory: /apps/timetrials-android
    schedule: {interval: monthly, time: "06:00", timezone: Europe/Amsterdam}
    cooldown: {default-days: 3}
    open-pull-requests-limit: 5
    groups:
      minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: pip
    directories: [/, /apps/timetrials-desktop/vision-runtime, /packages/tournament-extraction/python, /tooling/tournament]
    schedule: {interval: weekly, day: monday, time: "06:00", timezone: Europe/Amsterdam}
    cooldown: {default-days: 3}
    open-pull-requests-limit: 3
    # SymPy 1.14.0 requires mpmath<1.4. Reassess when a new SymPy release permits 1.4+.
    ignore:
      - dependency-name: mpmath
        versions: [">=1.4"]
    groups:
      minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories: [/backend/api, /apps/timetrials-web]
    schedule: {interval: monthly, time: "06:00", timezone: Europe/Amsterdam}
    cooldown: {default-days: 3}
    open-pull-requests-limit: 3
    groups:
      minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
  # The MySQL and Mailpit images in compose.yaml and compose.local.yaml, pinned as name:tag@sha256:...;
  # Dependabot moves tag and digest together. The MK8DX images there are built from this repository.
  - package-ecosystem: docker-compose
    directory: /
    schedule: {interval: monthly, time: "06:00", timezone: Europe/Amsterdam}
    cooldown: {default-days: 3}
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "mk8dx/*"
      # MySQL stays on the 8.4 LTS line the schema, migrations and MariaDB compatibility are tested on;
      # a new major (innovation or next LTS) is a deliberate migration, not a Dependabot bump.
      - dependency-name: "mysql"
        update-types: ["version-update:semver-major"]
    groups:
      minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: monthly, time: "06:00", timezone: Europe/Amsterdam}
    cooldown: {default-days: 3}
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
