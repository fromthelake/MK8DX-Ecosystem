# Weekly dependency update pull requests. Security updates are opened as soon as an advisory appears
# (enable "Dependabot security updates" in the repository settings).
# Exact pins stay exact: review each pull request like any other change (docs/TESTING.md).
# Group routine version updates per ecosystem; review majors separately.
version: 2
updates:
  - package-ecosystem: npm
    directories: [/backend/api, /apps/timetrials-web, /apps/timetrials-scanner-web]
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
    groups:
      minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: gradle
    directory: /apps/timetrials-android
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
    # OpenCV 5 changes Hough Mat shape and warp pixels, crossing an active
    # recognition margin. See docs/qa/OPENCV5_QUALIFICATION_2026-11-04.md.
    # Reassess with the unified searcher/matcher/decision pipeline or OpenCV 5.1,
    # no later than 2027-02-01. Security advisories still require review.
    ignore:
      - dependency-name: org.opencv:opencv
        versions: ["[5.0,6.0)"]
    groups:
      minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: pip
    directories: [/, /apps/timetrials-desktop/vision-runtime, /packages/tournament-extraction/python, /tooling/tournament]
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
    # SymPy 1.14.0 requires mpmath<1.4. Reassess when a new SymPy release permits 1.4+.
    ignore:
      - dependency-name: mpmath
        versions: [">=1.4"]
      # The OpenCV 5 QA comparison crosses an active recognition margin.
      # Reassess with pipeline unification or OpenCV 5.1 by 2027-02-01.
      - dependency-name: opencv-python
        versions: [">=5,<6"]
      - dependency-name: opencv-python-headless
        versions: [">=5,<6"]
    groups:
      minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories: [/backend/api, /apps/timetrials-web]
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
    groups:
      minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
