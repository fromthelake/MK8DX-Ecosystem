name: Verify
on:
  pull_request:
  push:
    branches: [main, 'release/**']
permissions:
  contents: read
# A newer push to the same branch or pull request cancels the run it replaces.
concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.12.0
          cache: npm
          cache-dependency-path: |
            backend/api/package-lock.json
            apps/timetrials-web/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Privacy and source boundaries
        run: |
          python tooling/privacy_scan.py
          python tooling/check_boundaries.py
          python tooling/check_docs.py
      - name: API dependencies and supported component checks
        run: |
          npm ci --prefix backend/api
          npm run typecheck --prefix backend/api
          npm test --prefix backend/api
          npm run build --prefix backend/api
          npm run check:links --prefix backend/api
      - name: Web dependencies and supported component checks
        run: |
          npm ci --prefix apps/timetrials-web
          npm ci --prefix tooling/i18n
          node tooling/i18n/extract_web_messages.mjs --check
          npm run typecheck --prefix apps/timetrials-web
          npm test --prefix apps/timetrials-web
          npm run build --prefix apps/timetrials-web
      - name: Central reader (TypeScript and Python, every committed parity vector)
        run: |
          # The public recognition pack, so tests that only need pack inputs run instead of skipping;
          # tests that also need private corpora keep skipping.
          node tooling/assets/materialize_collection.mjs recognition-pack "$RUNNER_TEMP/recognition-pack"
          export MK8DX_RECOGNITION_PACK="$RUNNER_TEMP/recognition-pack"
          export MK8DX_FRAME_DEFINITIONS="$RUNNER_TEMP/recognition-pack/frame-definitions-v1.json"
          test -s "$MK8DX_FRAME_DEFINITIONS" && test -d "$MK8DX_RECOGNITION_PACK/tensor-pack"
          # vectorParity.test.mjs replays every packages/icon-matcher/vectors file against the TS modules.
          node --experimental-strip-types --no-warnings --experimental-loader ./packages/icon-matcher/ts/ts_resolve_hook.mjs --test "packages/icon-matcher/ts/*.test.mjs"
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          PYTHONPATH=packages/icon-matcher/python python -m pytest -q -p no:cacheprovider -rs packages/icon-matcher/python/tests
      - name: CSS, intake rehearsal and tooling tests
        run: |
          node tooling/design-system/css-metrics.mjs --check
          MK8DX_INTAKE_TEST_ROOT="$RUNNER_TEMP" python tooling/test_intake.py -v
          python -m unittest discover -s tooling/tests -v
          python -m unittest tooling.release.test_host_bundle tooling.release.test_release_manifest -v
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Gitleaks over the history (reviewed allowlist in .gitleaks.toml)
        run: |
          image=ghcr.io/gitleaks/gitleaks@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" "$image" git /repo --redact --no-banner --log-opts=--all --config /repo/.gitleaks.toml
  npm-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        project: [backend/api, apps/timetrials-web, apps/timetrials-scanner-web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.12.0
      - name: Production dependencies have no high or critical advisory
        working-directory: ${{ matrix.project }}
        run: npm audit --omit=dev --audit-level=high
  python-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Scan every tracked Python manifest for high and critical advisories
        run: |
          python tooling/security/python_dependency_audit.py prepare "$RUNNER_TEMP/python-audit"
          set +e
          docker run --rm -v "$RUNNER_TEMP/python-audit:/audit:ro" \
            ghcr.io/google/osv-scanner@sha256:bf249317dcf838cf9e47f370cfd4dd4178d875bba14e3ce74d299c5bf1b129a1 \
            scan source -r /audit --no-resolve --format=json --verbosity=error \
            > "$RUNNER_TEMP/python-audit-report.json"
          scan_status=$?
          set -e
          if [ "$scan_status" -gt 1 ]; then exit "$scan_status"; fi
          python tooling/security/python_dependency_audit.py evaluate "$RUNNER_TEMP/python-audit-report.json"
  database-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        engine: [mysql, mysql84, mariadb]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.12.0
          cache: npm
          cache-dependency-path: backend/api/package-lock.json
      - name: Build API for disposable database tests
        run: |
          npm ci --prefix backend/api
          npm run build --prefix backend/api
      - name: Migrate a fresh schema and run every suite
        run: bash tooling/run_database_integration_ci.sh '${{ matrix.engine }}'
  scanner:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.12.0
          cache: npm
          cache-dependency-path: apps/timetrials-scanner-web/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Asset collection
        run: python tooling/assets/shared_asset_source.py verify
      - name: Browser scanner
        run: |
          npm ci --ignore-scripts --prefix apps/timetrials-scanner-web
          npm run sync-assets --prefix apps/timetrials-scanner-web
          npm run typecheck --prefix apps/timetrials-scanner-web
          MK8_BASE_PATH=/scanner/ npm run build --prefix apps/timetrials-scanner-web
      - name: Public test set (packages/assets/test-set)
        run: |
          npx --prefix apps/timetrials-scanner-web playwright install --with-deps chromium
          node tooling/test-set/score_test_set.mjs
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.12.0
      - name: Unit tests, central reader Java parity and debug APK (runner JDK 21 and Android SDK)
        working-directory: apps/timetrials-android
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          # The public recognition pack for the Java parity replays (IconScore, Refinement, FrameGeometry, LapGrid).
          node ../../tooling/assets/materialize_collection.mjs recognition-pack "$RUNNER_TEMP/recognition-pack"
          export MK8DX_RECOGNITION_PACK="$RUNNER_TEMP/recognition-pack"
          bash ./gradlew --no-daemon :app:testDebugUnitTest :scan-runtime:testDebugUnitTest :app:assembleDebug
      - name: Design tokens
        run: node packages/design-tokens/generate.mjs --check
  windows-clients:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: LiveTrial and Tournament sources compile
        run: |
          python -m compileall -q apps/timetrials-desktop apps/tournament-live/src apps/tournament-processor/src packages/tournament-extraction/python/src packages/tournament-connected/python/src tooling/livetrial tooling/tournament
      - name: Synthetic Windows client boundary tests
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pytest -q -p no:cacheprovider tests/windows_clients
  livetrial-tests:
    # LiveTrial is a Windows application; its tests assert Windows paths.
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: LiveTrial desktop tests
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          $env:PYTHONPATH = "apps/timetrials-desktop"
          python -m pytest -q -p no:cacheprovider apps/timetrials-desktop/tests
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.12.0
      - name: LiveTrial dashboard test
        run: node apps/timetrials-desktop/tests/history-startup.test.js
  tournament-package:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.12.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Tournament tools package (wheels, both recognition variants, locale templates)
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check build wheel
          python tooling/tournament/build_windows_package.py --output (Join-Path $env:RUNNER_TEMP 'tournament-package') --version ci --no-zip
  tournament-tests:
    # tests/tournament and a smoke of the recorded analysis after the text reading, on the Tools
    # package's locked runtime closure (Windows x64, CPython 3.12) and its public recorded assets.
    # A dependency bump that breaks that path fails here (issue #169: pandas 3).
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.12.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tooling/tournament/requirements.lock.txt
      - name: Locked Tournament Tools runtime (as the package installer does; CPU PyTorch, no Qt GUI)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $lock = 'tooling/tournament/requirements.lock.txt'
          # 1. The package's own torch selector, CPU mode, installed without dependencies first.
          $torch = python packages/tournament-extraction/python/src/mk8dx_tournament_extraction/setup_torch.py --mode cpu --format json | ConvertFrom-Json
          python -m pip install --disable-pip-version-check --only-binary=:all: --no-deps @($torch.pip_args)
          # 2. The product wheels, built from this checkout.
          $wheels = Join-Path $env:RUNNER_TEMP 'tournament-wheels'
          python -m pip wheel --disable-pip-version-check --no-deps -w $wheels packages/tournament-connected/python packages/tournament-extraction/python apps/tournament-processor apps/tournament-live packages/icon-matcher/python
          # 3. The locked closure with the lock as constraints, without the Qt GUI (no test needs it).
          $noGui = Join-Path $env:RUNNER_TEMP 'requirements-no-gui.txt'
          Get-Content $lock | Where-Object { $_ -notmatch '^(PySide6|shiboken6)' } | Set-Content $noGui
          $pytest = (Select-String -Path requirements-dev.txt -Pattern '^pytest==').Line
          python -m pip install --disable-pip-version-check --only-binary=:all: --find-links $wheels -r $noGui -c $lock mk8dx-tournament-connected 'mk8dx-tournament-extraction[vision]' mk8dx-tournament-processor mk8dx-tournament-live mk8dx-icon-matcher $pytest
          python -m pip check
          python -c "import cv2, numpy, pandas, torch, easyocr, openpyxl, mk8dx_tournament_extraction, tournament_processor, live_processor; print('pandas', pandas.__version__, 'numpy', numpy.__version__, 'torch', torch.__version__)"
      - name: Tournament tests and the recorded post-analysis smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          # The package's runtime-assets/recorded: the reviewed public collection groups.
          $assets = Join-Path $env:RUNNER_TEMP 'recorded-assets'
          node tooling/assets/materialize_collection.mjs tournament $assets
          node tooling/assets/materialize_collection.mjs tournament-text $assets
          $env:MK8DX_RECORDED_ASSETS = $assets
          python -m pytest -q -p no:cacheprovider -rs tests/tournament
  docker-images:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Website and API images build from source
        run: |
          docker build -f apps/timetrials-web/Dockerfile -t mk8dx-ci/web:check .
          docker build -f backend/api/Dockerfile -t mk8dx-ci/api:check .
