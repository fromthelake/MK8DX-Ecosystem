name: Release
# A tag v* builds the clients, source and server packages (host-local, A2 per platform, A3, B2) from that commit, attests the release
# assets, writes SHA256SUMS.txt and manifest.json, and opens a DRAFT release for review.
# The Android APK here is debug-signed; an official signed APK is attached by the maintainer (docs/CLIENT_BUILDS.md).
# Nothing is built unless the tagged commit already has a successful Verify run: tag a commit after its
# Verify run is green (re-run this workflow if the tag was pushed while Verify was still running).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
env:
  # workflow_dispatch runs on a branch (whose name may contain '/'); use a
  # harmless version string for package paths. Tagged runs keep the exact tag.
  PACKAGE_VERSION: ${{ github.event_name == 'workflow_dispatch' && 'v0.1.0-rc.0' || github.ref_name }}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verified:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: The tagged commit passed Verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/verify.yml/runs?head_sha=$GITHUB_SHA&status=success&per_page=1" --jq '.total_count')
          if [ "${count:-0}" -lt 1 ]; then
            echo "::error::No successful Verify run for $GITHUB_SHA; no release is built from an unverified commit."
            exit 1
          fi
  android:
    needs: verified
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.12.0
      - name: Debug APK
        working-directory: apps/timetrials-android
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          bash ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
          mkdir -p "$RUNNER_TEMP/out"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/out/mk8dx-android-debug-${PACKAGE_VERSION}.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: ${{ runner.temp }}/out/
  tournament:
    needs: verified
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.12.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Tournament tools package
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check build wheel
          python tooling/tournament/build_windows_package.py --output "$env:RUNNER_TEMP\tournament-tools-$env:PACKAGE_VERSION" --version "$env:PACKAGE_VERSION"
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\out" | Out-Null
          Move-Item "$env:RUNNER_TEMP\tournament-tools-$env:PACKAGE_VERSION.zip" "$env:RUNNER_TEMP\out\"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tournament
          path: ${{ runner.temp }}/out/
  livetrial:
    needs: verified
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.12.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: LiveTrial package (engine, assets, embedded Python)
        shell: pwsh
        run: |
          $venv = "$env:RUNNER_TEMP\livetrial-venv"
          python -m venv $venv
          & "$venv\Scripts\python.exe" -m pip install --disable-pip-version-check -r apps/timetrials-desktop/vision-runtime/requirements.txt pyinstaller==6.16.0
          if ($LASTEXITCODE -ne 0) { throw "LiveTrial dependency installation failed" }
          $embed = "$env:RUNNER_TEMP\python-3.12.10-embed-amd64.zip"
          Invoke-WebRequest -Uri https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip -OutFile $embed
          $out = "$env:RUNNER_TEMP\desktop-client-$env:PACKAGE_VERSION"
          & "$venv\Scripts\python.exe" tooling/livetrial/build_windows_package.py --output $out --engine-venv $venv --embedded-python $embed --version "$env:PACKAGE_VERSION" --product-icon apps/timetrials-web/styles/app-icon-512.png
          if ($LASTEXITCODE -ne 0) { throw "LiveTrial package build failed" }
          $icon = Join-Path $out "_internal\apps\timetrials-desktop\dashboard\app-icon.png"
          if (-not (Test-Path -LiteralPath $icon)) { throw "LiveTrial product icon missing from package" }
          if ((Get-FileHash -LiteralPath $icon -Algorithm SHA256).Hash -ne (Get-FileHash -LiteralPath apps/timetrials-web/styles/app-icon-512.png -Algorithm SHA256).Hash) {
            throw "LiveTrial product icon differs from Web"
          }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\out" | Out-Null
          Compress-Archive -Path "$out\*" -DestinationPath "$env:RUNNER_TEMP\out\desktop-client-$env:PACKAGE_VERSION.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: livetrial
          path: ${{ runner.temp }}/out/
  source:
    needs: verified
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Full source archive with the hydrated asset collection
        run: |
          python tooling/assets/shared_asset_source.py verify
          mkdir -p "$RUNNER_TEMP/out"
          python tooling/release/full_archive.py --output "$RUNNER_TEMP/out/mk8dx-full-local-${PACKAGE_VERSION}.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source
          path: ${{ runner.temp }}/out/
  host-package:
    needs: verified
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Build, package and publish versioned linux/amd64 images
        id: images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$PACKAGE_VERSION"
          mapfile -t images < <(python tooling/release/host_bundle.py --list-images --version "$version")
          test "${#images[@]}" -eq 4
          python tooling/assets/shared_asset_source.py verify
          docker build --platform linux/amd64 --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" --label org.opencontainers.image.version="$version" \
            -f backend/api/Dockerfile -t "${images[0]}" .
          docker build --platform linux/amd64 --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" --label org.opencontainers.image.version="$version" \
            -f apps/timetrials-web/Dockerfile -t "${images[1]}" .
          docker pull --platform linux/amd64 "${images[2]}"
          docker pull --platform linux/amd64 "${images[3]}"
          mkdir -p "$RUNNER_TEMP/out"
          python tooling/release/host_bundle.py --version "$version" --revision "$PACKAGE_VERSION" \
            --output "$RUNNER_TEMP/out/mk8dx-host-local-${PACKAGE_VERSION}-amd64.zip"
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            docker push "${images[0]}"
            docker push "${images[1]}"
            api_digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "${images[0]}")
            web_digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "${images[1]}")
            echo "api_digest=${api_digest##*@}" >> "$GITHUB_OUTPUT"
            echo "web_digest=${web_digest##*@}" >> "$GITHUB_OUTPUT"
          fi
      - name: Attest API image provenance
        if: github.event_name != 'workflow_dispatch'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/fromthelake/mk8dx-api
          subject-digest: ${{ steps.images.outputs.api_digest }}
          push-to-registry: true
      - name: Attest Web image provenance
        if: github.event_name != 'workflow_dispatch'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/fromthelake/mk8dx-web
          subject-digest: ${{ steps.images.outputs.web_digest }}
          push-to-registry: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-package
          path: ${{ runner.temp }}/out/*.zip
  macos-intel-cryptography:
    # cryptography publishes no Intel Mac wheel after 48.0.1 (which has known advisories). Build the pinned
    # version from source on an Intel Mac, OpenSSL linked in statically, and run the A2 CA tests with it there.
    needs: verified
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Build the cryptography wheel for Intel Macs
        run: sh tooling/release/build_macos_intel_cryptography.sh "$RUNNER_TEMP/built-wheels"
      - name: Test the A2 certificate and backup tools with that wheel
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/check"
          "$RUNNER_TEMP/check/bin/python" -m pip install --only-binary=:all: -r tooling/requirements-offline-lan.txt \
            --find-links "$RUNNER_TEMP/built-wheels"
          "$RUNNER_TEMP/check/bin/python" -c "import cryptography, sys; print('cryptography', cryptography.__version__); sys.exit(cryptography.__version__ != '$(sed -n 's/^cryptography==//p' tooling/requirements-offline-lan.txt)')"
          "$RUNNER_TEMP/check/bin/python" -m unittest -v tooling/tests/test_offline_lan_ca.py \
            tooling/tests/test_offline_lan_ca_lifecycle.py tooling/tests/test_auto_backup.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-intel-cryptography
          path: ${{ runner.temp }}/built-wheels/*.whl
  a2-packages:
    # A2 offline (ADR-0223): one package per host system and processor, each with its own image bundle and the
    # pinned CPython 3.12-3.15 wheels for the local CA tools. The containers are always Linux images, built natively
    # on an amd64 or arm64 runner (no emulation).
    needs: [verified, macos-intel-cryptography]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: windows, arch: amd64, wheel_tags: "win_amd64" }
          - { platform: linux, arch: amd64, wheel_tags: "manylinux_2_34_x86_64 manylinux_2_28_x86_64 manylinux_2_17_x86_64 manylinux2014_x86_64" }
          - { platform: linux, arch: arm64, wheel_tags: "manylinux_2_34_aarch64 manylinux_2_28_aarch64 manylinux_2_17_aarch64 manylinux2014_aarch64" }
          - { platform: macos, arch: arm64, wheel_tags: "macosx_11_0_arm64 macosx_10_9_universal2 macosx_10_13_universal2" }
          # macOS on Intel: cryptography comes from the macos-intel-cryptography job (built from source).
          - { platform: macos, arch: amd64, wheel_tags: "macosx_10_15_x86_64 macosx_10_15_universal2" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - if: matrix.platform == 'macos' && matrix.arch == 'amd64'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-intel-cryptography
          path: ${{ runner.temp }}/built-wheels
      - name: Build the images, fetch the wheels and package A2 for ${{ matrix.platform }}/${{ matrix.arch }}
        env:
          WHEEL_TAGS: ${{ matrix.wheel_tags }}
          A2_PLATFORM: ${{ matrix.platform }}
          A2_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          version="$PACKAGE_VERSION"
          mapfile -t images < <(python tooling/release/host_bundle.py --list-images --version "$version" --platform "$A2_PLATFORM" --arch "$A2_ARCH")
          test "${#images[@]}" -eq 4
          python tooling/assets/shared_asset_source.py verify
          for pair in "0 backend/api/Dockerfile" "1 apps/timetrials-web/Dockerfile"; do
            set -- $pair
            docker build --platform "linux/$A2_ARCH" \
              --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
              --label org.opencontainers.image.revision="$GITHUB_SHA" --label org.opencontainers.image.version="$version" \
              -f "$2" -t "${images[$1]}" .
          done
          docker pull --platform "linux/$A2_ARCH" "${images[2]}"
          docker pull --platform "linux/$A2_ARCH" "${images[3]}"
          platforms=()
          for tag in $WHEEL_TAGS; do platforms+=(--platform "$tag"); done
          mkdir -p "$RUNNER_TEMP/wheels" "$RUNNER_TEMP/out" "$RUNNER_TEMP/built-wheels"
          # One wheel per supported CPython (host_bundle.PYTHON_VERSIONS); abi3/none-any wheels arrive once.
          for py in 3.12 3.13 3.14 3.15; do
            python -m pip download --only-binary=:all: --implementation cp --python-version "$py" "${platforms[@]}" \
              --find-links "$RUNNER_TEMP/built-wheels" -r tooling/requirements-offline-lan.txt -d "$RUNNER_TEMP/wheels"
          done
          python tooling/release/host_bundle.py --version "$version" --revision "$PACKAGE_VERSION" \
            --offline-candidate --platform "$A2_PLATFORM" --arch "$A2_ARCH" --wheels-dir "$RUNNER_TEMP/wheels" \
            --output "$RUNNER_TEMP/out/mk8dx-a2-$A2_PLATFORM-$A2_ARCH-${PACKAGE_VERSION}.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: a2-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/out/*.zip
  native-packages:
    needs: verified
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.12.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Build A3 and B2 packages from source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($dir in @('backend/api', 'apps/timetrials-web', 'apps/timetrials-scanner-web')) {
            npm.cmd ci --prefix $dir --ignore-scripts
            if ($LASTEXITCODE -ne 0) { throw "npm ci failed: $dir" }
          }
          npm.cmd run build --prefix backend/api
          if ($LASTEXITCODE -ne 0) { throw 'API build failed' }
          npm.cmd run build --prefix apps/timetrials-web
          if ($LASTEXITCODE -ne 0) { throw 'Web build failed' }
          npm.cmd run sync-assets --prefix apps/timetrials-scanner-web
          if ($LASTEXITCODE -ne 0) { throw 'Scanner asset sync failed' }
          $env:MK8_BASE_PATH = '/scanner/'
          npm.cmd run build --prefix apps/timetrials-scanner-web
          if ($LASTEXITCODE -ne 0) { throw 'Scanner build failed' }
          $mailpit = Join-Path $env:RUNNER_TEMP 'mailpit-windows-amd64.zip'
          $mariadb = Join-Path $env:RUNNER_TEMP 'mariadb-11.4.13-winx64.zip'
          Invoke-WebRequest -Uri 'https://github.com/axllent/mailpit/releases/download/v1.32.0/mailpit-windows-amd64.zip' -OutFile $mailpit
          Invoke-WebRequest -Uri 'https://archive.mariadb.org/mariadb-11.4.13/winx64-packages/mariadb-11.4.13-winx64.zip' -OutFile $mariadb
          New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP 'out') | Out-Null
          python tooling/release/non_docker_bundle.py --output-dir (Join-Path $env:RUNNER_TEMP 'out') --mailpit-archive $mailpit --mariadb-archive $mariadb --revision $env:PACKAGE_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'A3/B2 package build failed' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-packages
          path: ${{ runner.temp }}/out/*.zip
  draft-release:
    needs: [android, tournament, livetrial, source, host-package, a2-packages, native-packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/dist
          merge-multiple: true
      - name: Generate SPDX software bill of materials for release assets
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: ${{ runner.temp }}/dist
          format: spdx-json
          output-file: ${{ runner.temp }}/dist/SBOM.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Include every built asset in SPDX inventory
        run: python3 tooling/release/complete_sbom.py "$RUNNER_TEMP/dist" "$RUNNER_TEMP/dist/SBOM.spdx.json"
      - name: Checksums, manifest and a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/dist"
          cp "$GITHUB_WORKSPACE/LICENSE" "$GITHUB_WORKSPACE/LICENSE_SCOPE.md" "$GITHUB_WORKSPACE/SOURCE_FOR_BINARIES.txt" .
          cp "$GITHUB_WORKSPACE/docs/THIRD_PARTY_MATERIALS.md" .
          cp "$GITHUB_WORKSPACE"/docs/install/MK8DX_User_Guide_EN.* "$GITHUB_WORKSPACE"/docs/install/MK8DX_Handleiding_NL.* .
          # The APK cannot carry loose files: its notices travel beside it.
          (cd "$GITHUB_WORKSPACE" && zip -q -X "$RUNNER_TEMP/dist/mk8dx-android-notices-${PACKAGE_VERSION}.zip" \
            LICENSE LICENSE_SCOPE.md SOURCE_FOR_BINARIES.txt docs/THIRD_PARTY_MATERIALS.md)
          python3 "$GITHUB_WORKSPACE/tooling/release/release_manifest.py" . "$PACKAGE_VERSION" "$GITHUB_SHA"
          sha256sum -- * > SHA256SUMS.txt
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Dry run: packages, manifest and checksums built; no tag or release created."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$GITHUB_REF_NAME" \
            --notes "Draft built from $GITHUB_SHA. Replace the debug APK with the locally release-signed APK, refresh SHA256SUMS.txt, verify downloads and attestations (docs/RELEASE_PACKAGES.md), review and publish." -- *
      - name: Attest exact release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/dist/*
      - name: Verify every generated provenance record
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for file in "$RUNNER_TEMP"/dist/*; do
            test -f "$file"
            gh attestation verify "$file" -R "$GITHUB_REPOSITORY" >/dev/null
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'workflow_dispatch'
        with:
          name: release-dry-run
          path: ${{ runner.temp }}/dist/
