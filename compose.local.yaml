services:
  mailpit:
    # Tag and digest pinned, like mysql in compose.yaml.
    image: axllent/mailpit:v1.32.0@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    ports:
      - "127.0.0.1:${MK8DX_MAILPIT_PORT:?}:8025"
    restart: unless-stopped
    logging: {options: {max-size: "10m", max-file: "3"}}
  api:
    depends_on:
      mysql: {condition: service_healthy}
      mailpit: {condition: service_started}
