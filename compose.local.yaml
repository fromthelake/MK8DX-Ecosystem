services:
  mailpit:
    # Tag and digest pinned, like mysql in compose.yaml.
    image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    ports:
      - "127.0.0.1:${MK8DX_MAILPIT_PORT:?}:8025"
    restart: unless-stopped
    logging: {options: {max-size: "10m", max-file: "3"}}
  api:
    depends_on:
      mysql: {condition: service_healthy}
      mailpit: {condition: service_started}
