<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
    <title>MK8DX · Offline invitation</title>
    <link rel="stylesheet" href="/offline-invite/style.css">
    <script src="/offline-invite/app.js" defer></script>
  </head>
  <body>
    <main>
      <h1 id="title">Join this MK8DX installation</h1>
      <p id="explanation">First check that this HTTPS address belongs to the host you trust. The invitation can be used once.</p>
      <p id="status" role="status" aria-live="polite">Checking invitation…</p>
      <button id="redeem" type="button" disabled>Accept invitation</button>
      <a id="continue" href="/" hidden>Continue to MK8DX</a>
    </main>
    <noscript>JavaScript is required to accept this invitation.</noscript>
  </body>
</html>
