# Include this file once from XAMPP apache/conf/httpd.conf.
# Only the loopback MK8DX site on port 18090 is affected.
<IfModule !proxy_module>
    LoadModule proxy_module modules/mod_proxy.so
</IfModule>
<IfModule !proxy_http_module>
    LoadModule proxy_http_module modules/mod_proxy_http.so
</IfModule>
Listen 127.0.0.1:18090
<VirtualHost 127.0.0.1:18090>
    ServerName 127.0.0.1
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyPass "/" "http://127.0.0.1:18190/"
    ProxyPassReverse "/" "http://127.0.0.1:18190/"
</VirtualHost>
